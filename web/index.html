<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Susambil — 3D shahar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;800&family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: rgba(18,22,30,.78);
    --bg-solid:#141922;
    --line: rgba(255,255,255,.10);
    --ink:#f4f1ea;
    --muted:#a9b0bc;
    --accent:#2fb5a3;
    --accent-ink:#06231f;
    --gold:#f3c14b;
    --danger:#e86a5a;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .glass{background:var(--bg);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line)}

  /* top bar */
  #top{position:fixed;left:10px;right:10px;top:10px;display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
  #top > *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;font-weight:800;letter-spacing:.2px}
  .brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#2fb5a3,#3a6ea5);display:inline-block;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
  .chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
  .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a3,#e0a520 70%);box-shadow:0 0 0 2px rgba(0,0,0,.2) inset}
  .spacer{flex:1}
  #fps{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);font-weight:600}
  #fps b{color:var(--ink)}
  @media (max-width:520px){ .brand span{display:none} .brand{padding:8px} #clockChip .lbl{display:none} }

  /* legend */
  #legend{position:fixed;left:10px;top:62px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px);pointer-events:none}
  #legend .chip{font-size:12px;padding:5px 10px;font-weight:600;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* side tools */
  #tools{position:fixed;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:5}
  .tool{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:13px}
  .tool svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tool:active{transform:scale(.94)}

  /* bottom nav */
  /* bottom menu — design A: floating capsule with a raised gold centre button */
  #nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:5;width:min(440px,calc(100% - 28px));height:72px;
       display:flex;align-items:center;padding:0 6px;border-radius:26px;background:rgba(18,22,40,.88);border:1px solid rgba(255,255,255,.09);
       box-shadow:0 18px 40px rgba(0,0,0,.45);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}
  #nav .ni{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:700;color:#8e94a8;min-width:0}
  #nav .ni svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #nav .ni i{width:4px;height:4px;border-radius:2px;background:transparent}
  #nav .ni.on{color:#f6c453} #nav .ni.on i{background:#f6c453}
  #nav .ni:active{transform:scale(.94)}
  #nav .gap{flex:1.15;height:100%}
  #fab{position:absolute;left:50%;top:-30px;width:66px;height:66px;margin-left:-33px;border-radius:33px;border:4px solid #12162a;background:#f6c453;color:#22180a;
       display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(246,196,83,.18),0 10px 26px rgba(246,196,83,.35);transition:transform .15s}
  #fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #fab:active{transform:scale(.93)}
  #fab + b{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:11.5px;font-weight:800;color:#f6c453;pointer-events:none}
  #sheet{bottom:0}
  body:not(.hero) #tools{top:auto;bottom:118px;transform:none}

  /* sheet */
  #sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(520px,100%);z-index:10;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:78vh;overflow:auto;background:rgba(20,25,34,.94)}
  #sheet.open{transform:translate(-50%,0)}
  #sheet .grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.22);margin:2px auto 12px}
  #sheet h3{margin:0 0 2px;font-size:20px;font-weight:800}
  #sheet .sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .kv div{background:rgba(255,255,255,.05);border-radius:12px;padding:9px 11px}
  .kv small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
  .kv b{font-size:15px}
  .row{display:flex;gap:8px}
  .btn{flex:1;padding:14px 16px;border-radius:14px;font-weight:800;font-size:15px;background:rgba(255,255,255,.08);min-height:48px}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.gold{background:var(--gold);color:#2b1d00}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:active:not(:disabled){transform:scale(.98)}
  .note{font-size:12.5px;color:var(--muted);margin-top:10px}
  .note.warn{color:#f6b2a8}
  .x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.07);font-size:18px}

  .tpls{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scroll-snap-type:x mandatory}
  .tpl{flex:0 0 132px;scroll-snap-align:start;border-radius:14px;background:rgba(255,255,255,.05);padding:10px;text-align:left;border:2px solid transparent}
  .tpl.sel{border-color:var(--accent);background:rgba(47,181,163,.12)}
  .tpl .ic{height:62px;border-radius:10px;margin-bottom:8px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
  .tpl .ic svg{width:56px;height:56px}
  .tpl b{display:block;font-size:13.5px}
  .tpl small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}
  .tpl:disabled{opacity:.45}
  .swatches{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
  .sw.sel{border-color:var(--ink)}
  .carcard{border-radius:16px;background:rgba(255,255,255,.05);overflow:hidden;margin-bottom:12px}
  .carimg{aspect-ratio:16/9;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 85%,rgba(255,255,255,.16),rgba(255,255,255,.03) 60%);color:var(--muted);font-size:12.5px}
  .carimg img{width:100%;height:100%;object-fit:contain;display:block}
  .carinfo{padding:12px 14px 14px}.carinfo>b{font-size:17px}.carinfo small{display:block;color:var(--muted);font-size:12.5px;margin:3px 0 10px;line-height:1.4}
  .carinfo .specs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .carinfo .specs span{background:rgba(255,255,255,.05);border-radius:10px;padding:6px 8px;font-weight:800;font-size:13px}
  .carinfo .specs i{display:block;font-style:normal;color:var(--muted);font-weight:600;font-size:10.5px}
  .carinfo .price{color:var(--gold);font-size:17px;flex:1}
  .carbox .carimg{border-radius:14px;margin-bottom:6px}
  .carbox canvas.plate{display:block;width:min(260px,100%);height:auto;margin:4px auto 12px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .carbox .fld{display:flex;gap:8px;margin-bottom:10px}
  .carbox select,.carbox input.pt{height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);padding:0 12px;font:700 17px Manrope,sans-serif;letter-spacing:1px}
  .carbox select{flex:0 0 84px}
  .carbox input.pt{flex:1;min-width:0;text-transform:uppercase}
  .carbox .sw input[type=color]{opacity:0;width:100%;height:100%;cursor:pointer}
  .carbox .sw.pick{background:conic-gradient(#e74c3c,#f1c40f,#2ecc71,#3498db,#9b59b6,#e74c3c)}
  .carbox .chkline{font-size:12.5px;margin:-4px 2px 10px;color:var(--muted)}
  .carbox .chkline.ok{color:#7fd99a}.carbox .chkline.bad{color:#f6b2a8}
  .lbl2{font-size:12px;color:var(--muted);font-weight:700;margin:0 4px 0 0;text-transform:uppercase;letter-spacing:.6px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chipb{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.07);font-weight:700;font-size:13px;color:var(--muted)}
  .chipb.on{background:var(--ink);color:#141922}
  .tpl small+small{margin-top:0}
  .seg{display:flex;background:rgba(255,255,255,.06);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
  .seg button{flex:1;padding:10px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
  .seg button.on{background:var(--ink);color:#141922}
  input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 14px}

  .list .item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:8px}
  .list .item div{flex:1}
  .list .item small{color:var(--muted);display:block;font-size:12px}
  .list .item button{padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.08);font-weight:700;font-size:13px}

  /* toast */
  #toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;z-index:20;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* tutorial */
  #tut{position:fixed;left:50%;top:112px;transform:translateX(-50%);z-index:6;width:min(420px,calc(100% - 20px));border-radius:16px;padding:12px 14px;display:none;gap:10px;align-items:flex-start}
  #tut.show{display:flex}
  #tut .n{flex:0 0 28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
  #tut p{margin:0;font-size:14px;line-height:1.4;flex:1}
  #tut button{color:var(--muted);font-size:12.5px;font-weight:700;padding:4px}

  /* ---------- welcome screen over the living city ---------- */
  body.hero #labels{opacity:0} body.hero .plbl{pointer-events:none}
  #labels{transition:opacity .6s}
  body.hero #top, body.hero #legend, body.hero #tools, body.hero #nav, body.hero #tut, body.hero #sheet{display:none}
  #hero{position:fixed;inset:0;z-index:30;display:none;pointer-events:none;color:#fff8ec}
  #hero.show{display:block}
  #hero::before{content:'';position:absolute;inset:0;background:
      radial-gradient(ellipse 70% 55% at 50% 58%, rgba(10,12,30,.62), rgba(10,12,30,.15) 70%, transparent),
      linear-gradient(180deg, rgba(10,12,30,.0) 0%, rgba(10,12,30,.0) 35%, rgba(12,14,34,.55) 80%, rgba(12,14,34,.85) 100%)}
  .h-top{position:absolute;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:auto}
  .h-brand{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:16px;background:rgba(16,18,40,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
           font:700 19px/1 Philosopher,Georgia,serif;letter-spacing:.18em;color:#f6efe2;border:1px solid rgba(255,255,255,.08)}
  .h-brand svg{flex:0 0 26px}
  .h-brand i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 45deg,#2fb5a3,#3a6ea5,#f6c453,#2fb5a3);animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .h-pop{padding:10px 18px;border-radius:16px;background:rgba(16,18,40,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:center;border:1px solid rgba(255,255,255,.08)}
  .h-right{display:flex;gap:10px;align-items:flex-start}
  .h-snd{width:52px;height:52px;border-radius:16px;background:rgba(16,18,40,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);color:#f0c566;display:grid;place-items:center}
  .h-snd .x{display:none} .h-snd.off .x{display:inline} .h-snd.off .w1,.h-snd.off .w2{display:none} .h-snd.off{color:#cfcbe6}
  .h-snd.playing .w2{animation:sndw 1.2s ease-in-out infinite} @keyframes sndw{50%{opacity:.25}}
  .h-pop small{display:block;color:#f6c453;font:800 11px/1 Unbounded,sans-serif;letter-spacing:.14em;margin-bottom:4px}
  .h-pop b{font:800 26px/1 Unbounded,sans-serif;font-variant-numeric:tabular-nums}
  .h-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);width:min(640px,calc(100% - 32px));text-align:center;pointer-events:auto}
  .h-langs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
  .h-langs button{padding:9px 16px;border-radius:999px;background:rgba(30,32,62,.78);font-weight:800;font-size:14px;color:#e9e5ff;border:1px solid rgba(255,255,255,.08)}
  .h-langs button.on{background:#f6c453;color:#2a1d00}
  .h-badge{display:inline-block;padding:8px 16px;border-radius:12px;background:#f6c453;color:#2a1d00;font:800 14px/1.1 Manrope,sans-serif;box-shadow:0 0 0 0 rgba(246,196,83,.6);animation:pulse 2.8s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(246,196,83,.55)}70%{box-shadow:0 0 0 18px rgba(246,196,83,0)}100%{box-shadow:0 0 0 0 rgba(246,196,83,0)}}
  #hero h1{margin:4px 0 10px;font:700 clamp(56px,9vw,108px)/.95 Philosopher,Georgia,serif;letter-spacing:.01em;color:#f6e2b0;text-shadow:0 6px 40px rgba(0,0,0,.35)}
  .h-orn{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;white-space:nowrap;color:#f0c566;font:700 12.5px/1 Manrope,sans-serif;letter-spacing:.24em}
  .h-orn::before,.h-orn::after{content:'';width:56px;height:1px;background:#f0c566}
  .h-orn svg{flex:0 0 14px}
  #hero p.h-sub{margin:0 auto 22px;max-width:600px;font-size:clamp(15px,2.1vw,18px);line-height:1.6;color:#efe6d6;font-weight:500}
  .h-in{display:flex;align-items:center;height:62px;border-radius:18px;background:rgba(14,16,36,.82);border:2px solid #f6c453;box-shadow:0 0 34px rgba(246,196,83,.25);padding:0 18px;margin-bottom:12px}
  .h-in span{color:#2AABEE;font:800 22px/1 Manrope,sans-serif;margin-right:6px}
  .h-in input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;color:#fff;font:700 19px Manrope,sans-serif;text-align:center}
  .h-in input::placeholder{color:#8f8db2}
  .h-in svg{flex:0 0 26px}
  .h-btn{width:100%;height:62px;border-radius:18px;background:#f6c453;color:#22180a;font:800 20px/1 Manrope,sans-serif;box-shadow:0 10px 30px rgba(246,196,83,.25);transition:transform .15s}
  .h-btn:active{transform:scale(.98)}
  #findMsg{min-height:0;max-height:0;overflow:hidden;transition:.25s;color:#ffd1c4;font-weight:700;font-size:14px;margin-top:0}
  #findMsg.show{max-height:80px;margin-top:10px}
  .h-cta{display:inline-flex;margin-top:16px;padding:12px 22px;border-radius:999px;font:800 17px/1 Manrope,sans-serif;color:#ffd98a;
         background:linear-gradient(90deg,#5b2a86,#a23b72,#5b2a86);background-size:200% 100%;animation:shine 6s linear infinite;border:1.5px solid rgba(255,217,138,.45)}
  @keyframes shine{to{background-position:200% 0}}
  .h-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .h-chips button{padding:9px 14px;border-radius:999px;background:rgba(20,22,46,.8);font-weight:800;font-size:13.5px;color:#f1efff;border:1.5px solid rgba(255,255,255,.08)}
  .h-chips button:nth-child(1){border-color:#5fd4f0;color:#bff1ff}
  .h-chips button:nth-child(2){border-color:#f08ab4;color:#ffd0e3}
  .h-row{display:flex;gap:18px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
  .h-get{padding:11px 20px;border-radius:14px;background:rgba(47,181,163,.95);color:#06231f;font-weight:800;font-size:15px}
  .h-get.pulse{animation:pulse2 1.2s ease-in-out 3}
  @keyframes pulse2{50%{transform:scale(1.07)}}
  .h-browse{color:#fff;font-weight:800;font-size:15.5px;text-decoration:underline;text-underline-offset:4px;background:none}
  .h-foot{margin-top:14px;color:#cfcbe6;font-weight:700;font-size:14px}
  .h-foot b{color:#f6c453}
  .h-mid > *{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .h-mid > *:nth-child(2){animation-delay:.06s} .h-mid > *:nth-child(3){animation-delay:.12s} .h-mid > *:nth-child(4){animation-delay:.18s}
  .h-mid > *:nth-child(5){animation-delay:.24s} .h-mid > *:nth-child(6){animation-delay:.3s} .h-mid > *:nth-child(7){animation-delay:.36s}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .h-mid > *, .h-badge, .h-cta{animation:none} }
  @media (max-width:560px){ .h-snd{width:44px;height:44px} .h-orn::before,.h-orn::after{width:28px} .h-orn{gap:8px;letter-spacing:.18em} .h-mid{top:auto;bottom:18px;transform:translateX(-50%)} .h-pop b{font-size:20px} .h-brand{font-size:12px} .h-in,.h-btn{height:56px} .h-chips button:nth-child(n+5){display:none} }
  @media (max-height:700px) and (min-width:561px){ .h-mid{transform:translate(-50%,-50%) scale(.88)} }

  /* owner labels over buildings */
  #labels{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  .olbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;background:rgba(14,18,26,.80);
        border:1.5px solid rgba(255,255,255,.22);color:#fff;font:700 12px/1 Manrope,system-ui,sans-serif;white-space:nowrap;max-width:230px;will-change:transform}
  .olbl span{overflow:hidden;text-overflow:ellipsis}
  .olbl.tg{border-color:rgba(42,171,238,.85)}
  .olbl.mine{background:rgba(14,64,58,.92);border-color:#2fb5a3}
  .olbl.mine i{width:7px;height:7px;border-radius:50%;background:#2fb5a3;display:inline-block}
  .olbl::after{content:'';position:absolute;left:50%;bottom:-5px;width:8px;height:8px;margin-left:-4px;background:inherit;border-right:inherit;border-bottom:inherit;transform:rotate(45deg);border-radius:0 0 2px 0}
  /* login / nickname */
  #auth{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(8,11,16,.55)}
  .authbox{width:min(420px,100%);border-radius:22px;padding:22px;background:rgba(20,25,34,.94);max-height:92vh;overflow:auto}
  .authbox .logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#2fb5a3,#3a6ea5);margin-bottom:10px}
  .authbox h2{margin:0 0 4px;font-size:22px;font-weight:800}
  .authbox .lead{color:var(--muted);margin:0 0 12px;font-size:14px;line-height:1.45}
  .authbox input:not([type=checkbox]){width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
  .authbox .row input{flex:1}

  .vsep{width:1px;height:22px;background:var(--line)}
  #topCap .chip{padding:0;gap:7px;font-size:14px;font-weight:800}
  #topCap .coins b{font:800 15px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
  .coin{width:18px;height:18px}
  .cap.mini{height:36px;border-radius:14px;display:flex;align-items:center;padding:0 12px;font-size:12px}
  #fps{color:var(--muted);font-weight:700}
  @media (max-width:520px){ #topCap .brand > span{display:none} #topCap{gap:10px;padding-right:12px} #fps{display:none} }

  /* legend */
  #legend{left:14px;top:calc(max(14px,env(safe-area-inset-top)) + 62px);gap:12px;max-width:none;width:auto}
  #legend .lg{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:3px}

  /* camera tools: one vertical capsule */
  #tools{right:14px;gap:2px;padding:6px;flex-direction:column}
  .tool{width:46px;height:46px;border-radius:16px;color:#c9cde0;font:800 12px/1 var(--display);background:none;border:0;box-shadow:none}
  .tool svg{stroke:currentColor}
  .tool:hover{background:rgba(255,255,255,.06)} .tool:active{color:var(--gold)}

  /* bottom sheets */
  #sheet{width:min(540px,100%);background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -18px 50px rgba(0,0,0,.5);padding:12px 20px calc(20px + env(safe-area-inset-bottom))}

  #sheet h3{font:700 19px/1.25 var(--display);letter-spacing:-.005em;padding-right:44px}

  .x{right:14px;top:14px;width:38px;height:38px;border-radius:19px;background:rgba(255,255,255,.07);color:var(--muted);font-size:16px}
  .kv{gap:10px;margin-bottom:16px}

  .kv small{font-size:11.5px;font-weight:700;letter-spacing:.02em}
  .kv b{font-size:15.5px}
  .row{gap:10px}
  .btn{border-radius:16px;min-height:52px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06);font-size:15px}
  .btn.primary,.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent;box-shadow:0 10px 24px rgba(246,196,83,.22)}

  .note{line-height:1.45} .note.warn{color:#ffb4a6}
  .lbl2{color:var(--muted);letter-spacing:.08em;font-size:11.5px}
  .tpl{border-radius:18px;background:rgba(255,255,255,.045);border:1.5px solid rgba(255,255,255,.06);padding:12px}
  .tpl.sel{border-color:var(--gold);background:rgba(246,196,83,.09);box-shadow:0 0 0 3px rgba(246,196,83,.12)}
  .tpl .ic{border-radius:12px;background:rgba(255,255,255,.04)}
  .sw{width:32px;height:32px}

  .seg{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:4px}

  input[type=checkbox]{accent-color:var(--gold)}

  #tut{top:calc(max(14px,env(safe-area-inset-top)) + 112px);background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:22px;padding:14px 16px}

const CHUNK = 8*PITCH, CHUNKS = [];

    base, lod, attrs, map,
    get(x,z){
      const k = chunkKey(x,z); let c = map.get(k);

        const m = base.clone(base.name+'#'+k); m.makeGeometryUnique(); m.setEnabled(true);
        m.isPickable = false; m.receiveShadows = base.receiveShadows;
        for (const a of attrs) m.thinInstanceRegisterAttribute(a, 4);

      }

    },
    add(matrix, x, z){ const c = this.get(x,z); return { c, i: c.mesh.thinInstanceAdd(matrix, false) }; },
    flush(){

  // entrance canopy on the bowed front, with three slim columns
  { const out = [], inn = []; for (let i = 0; i <= 12; i++){ const t = 0.3 + 0.4*i/12, z = lerp(PD.zb, PD.za, t), x = PD.xa - PD.bulge*Math.sin(Math.PI*t); out.push(new V3(x - 3.5, G0 - 0.2, z)); inn.push(new V3(x, G0 - 0.2, z)); }

  // tower: glass shaft, LED line, dark crown, roof, plant
  add(wall(rr(T.hx, T.hz, T.r, PH), rr(T.hx, T.hz, T.r, H - 3)), glassM);
  // night show: the flag of Uzbekistan in lit windows all round the shaft — blue, white and green bands with thin red
  // lines between them, the crescent and 12 stars on the blue band of the front and back faces. An additive overlay
  // just outside the glass: black (invisible) by day, its emissive follows the night like the city's windows.
  { const ring = rr(T.hx + 0.06, T.hz + 0.06, T.r, PH), seg = (a, b) => V3.Distance(a, b);
    const at = []; ring.reduce((s, p, i, a) => { at.push(i ? s + seg(a[i - 1], p) : 0); return at[i]; }, 0);
    const len = at[at.length - 1] + seg(ring[ring.length - 1], ring[0]);           // all the way round (the closing span is the +x face)
    const n = 8, arc = Math.PI*T.r/2, side = 2*(T.hx - T.r), face = 2*(T.hz - T.r);

    const W = 2048, Hh = 512, floors = Math.round((H - 3 - PH)/FLOOR_H);
    const ft = new B.DynamicTexture('htlFlag', { width: W, height: Hh }, scene, true), g = ft.getContext();
    const bands = [['#0099b5', 0, 0.32], ['#ce1126', 0.32, 0.34], ['#ffffff', 0.34, 0.66], ['#ce1126', 0.66, 0.68], ['#1eb53a', 0.68, 1]];
    for (const [c, a, b] of bands){ g.fillStyle = c; g.fillRect(0, a*Hh, W, (b - a)*Hh + 1); }
    const emblem = u0 => {                                                         // crescent + 12 stars (3, 4, 5 rows)
      const x0 = u0*W, fwp = fw*W, cy = 0.16*Hh, r = 0.115*Hh;
      g.fillStyle = '#ffffff'; g.beginPath(); g.arc(x0 + fwp*0.13, cy, r, 0, 6.29); g.fill();
      g.fillStyle = '#0099b5'; g.beginPath(); g.arc(x0 + fwp*0.13 + r*0.32, cy - r*0.05, r*0.88, 0, 6.29); g.fill();
      const star = (x, y, rad) => { g.beginPath(); for (let i = 0; i < 10; i++){ const a = -Math.PI/2 + i*Math.PI/5, rr2 = i % 2 ? rad*0.42 : rad; g.lineTo(x + rr2*Math.cos(a), y + rr2*Math.sin(a)); } g.closePath(); g.fill(); };
      g.fillStyle = '#ffffff'; const dx = fwp*0.075, dy = 0.075*Hh;
      [[3, 2], [4, 1], [5, 0]].forEach(([cnt, skip], row) => { for (let i = 0; i < cnt; i++) star(x0 + fwp*0.27 + (skip + i)*dx, cy - dy + row*dy, 0.022*Hh); });

    const cols = Math.round(len/1.6); for (let c = 0; c < cols; c++) g.fillRect(c*W/cols - 1, 0, 2.5, Hh);

  add(wall(rr(T.hx + 0.2, T.hz + 0.2, T.r, H - 2.6), rr(T.hx + 0.2, T.hz + 0.2, T.r, H)), darkM);
  add(merge([cap(rr(T.hx + 0.2, T.hz + 0.2, T.r, H)), box(6, 2, 10, T.x + 1.5, H + 1, T.z)]), darkM);

    g.fillStyle = '#2c3238'; g.fillRect(0, 0, 512, 128); g.fillStyle = '#ffffff'; g.font = 'bold 84px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('HOTEL', 256, 70); t.update();

  for (const m of [s1, s2]){ m.computeWorldMatrix(true); m.bakeCurrentTransformIntoVertices(); }
  add(merge([s1, s2]), signM);
  // a reflecting pool in front
  add(box(5, 0.2, 18, PD.xa - 9, 0.1, 0), mats.water);
  return { P, height: H + 2 };

// ---- Chorsu bozori: the great turquoise dome on a ring of white arches with a gold crown, four small domes in the
// corners and rows of market stalls with striped awnings, crates of fruit and vegetables, all inside one block ----
function chorsuParts(){
  const P = [], add = (m, mat) => { m.computeWorldMatrix(true); m.bakeCurrentTransformIntoVertices(); P.push([m, mat, null]); };
  const dynTex = (name, w, h, draw) => { const d = new B.DynamicTexture(name + 'd', { width: w, height: h }, scene, true), e = new B.DynamicTexture(name + 'e', { width: w, height: h }, scene, true);
    const a = d.getContext(), b = e.getContext(); b.fillStyle = '#000'; b.fillRect(0, 0, w, h); draw(a, b, w, h); d.update(true); e.update(true);
    for (const t of [d, e]){ t.wrapU = t.wrapV = B.Texture.WRAP_ADDRESSMODE; t.anisotropicFilteringLevel = 8; } return { d, e }; };
  // dome tiles: one gore per texture width — turquoise with darker blue ornament, white rib on each edge, lighter towards the top
  // (the lathe's u runs up the profile, v around it, so the gore is drawn lying on its side: x = height, y = around)
  const domeTex = (name, gores) => { const t = dynTex(name, 512, 128, (a, b, w, h) => {
      const g = a.createLinearGradient(0, 0, w, 0); g.addColorStop(0, '#1f8fb0'); g.addColorStop(0.6, '#2eb3c8'); g.addColorStop(1, '#67d3df'); a.fillStyle = g; a.fillRect(0, 0, w, h);
      a.fillStyle = '#17607f'; for (let x = 30; x < w - 20; x += 34){ const k = 1 - x/w*0.6; a.beginPath(); a.moveTo(x - 12*k, h/2); a.lineTo(x, h/2 + 18*k); a.lineTo(x + 12*k, h/2); a.lineTo(x, h/2 - 18*k); a.closePath(); a.fill(); }
      a.fillStyle = '#e8f6f7'; for (let x = 30; x < w - 20; x += 34){ a.beginPath(); a.arc(x, h/2, 3, 0, 6.29); a.fill(); }
      a.fillStyle = '#9fe2ea'; for (let x = 47; x < w - 20; x += 34){ a.fillRect(x - 1, h*0.22, 4, 4); a.fillRect(x - 1, h*0.78 - 4, 4, 4); }
      a.fillStyle = '#f4fbfb'; a.fillRect(0, 0, w, 7); a.fillRect(0, h - 7, w, 7);
      a.fillStyle = '#d9b44a'; a.fillRect(0, 0, 10, h); });
    t.d.vScale = t.e.vScale = gores; const m = stdMat(name + 'M', { dt: t.d, spec: new C3(.65,.7,.72), power: 90 }); m.emissiveColor = hex('#2eb3c8').scale(0.12); return m; };
  // a shallow dome on a drum ringed by white arches (glazed behind); r = radius, h = dome rise, y0 = springing height
  const goldM = stdMat('chGold', { diffuse: hex('#d8ad3e'), spec: new C3(1,.9,.6), power: 120 });
  const whiteM = stdMat('chWhite', { diffuse: hex('#f4f2ec'), spec: new C3(.3,.3,.3), power: 40 });
  const wt = dynTex('chWin', 64, 64, (a, b, w, h) => { a.fillStyle = '#52707e'; a.fillRect(0, 0, w, h); a.fillStyle = '#9db8c2'; a.fillRect(0, 0, w, 6); a.fillStyle = '#c6d2d6'; a.fillRect(w/2 - 1, 0, 2, h); a.fillRect(0, h/2, w, 2);
    b.fillStyle = '#ffcf85'; b.fillRect(2, 8, w - 4, h - 10); });
  const winM = stdMat('chWinM', { dt: wt.d, et: wt.e, spec: new C3(.6,.6,.6), power: 100 }); nightMats.push(winM);
  const dome = (cx, cz, r, h, y0, n, mat) => {
    const prof = []; for (let i = 0; i <= 16; i++){ const t = i/16, rr = r*Math.cos(t*Math.PI/2*0.94), yy = y0 + h*Math.sin(t*Math.PI/2*0.94); prof.push(new V3(Math.max(rr, r*0.09), yy, 0)); }
    const d = B.MeshBuilder.CreateLathe('chDome', { shape: prof, tessellation: n*4, sideOrientation: B.Mesh.DOUBLESIDE }, scene); d.position.set(cx, 0, cz); add(d, mat);
    const drum = B.MeshBuilder.CreateCylinder('chDrum', { diameter: 2*r*0.97, height: y0, tessellation: n*2 }, scene); drum.position.set(cx, y0/2, cz);
    wt.d.uScale = wt.e.uScale = n*2; add(drum, winM);
    const arches = []; for (let i = 0; i < n; i++){ const a0 = i/n*Math.PI*2, a1 = (i + 1)/n*Math.PI*2, path = [];
      for (let k = 0; k <= 10; k++){ const t = k/10, a = lerp(a0, a1, t), lift = Math.sin(Math.PI*t); path.push(new V3(cx + (r + 0.15)*Math.cos(a), y0*0.25 + y0*0.8*Math.pow(lift, 0.55), cz + (r + 0.15)*Math.sin(a))); }
      arches.push(B.MeshBuilder.CreateTube('chArch', { path, radius: Math.max(0.12, r*0.022), tessellation: 5 }, scene));
      const leg = B.MeshBuilder.CreateCylinder('chLeg', { diameter: Math.max(0.24, r*0.045), height: y0*0.25 + 0.05, tessellation: 5 }, scene); leg.position.set(cx + (r + 0.15)*Math.cos(a0), (y0*0.25)/2, cz + (r + 0.15)*Math.sin(a0)); arches.push(leg); }
    const ring = B.MeshBuilder.CreateTorus('chRing', { diameter: 2*(r + 0.1), thickness: Math.max(0.2, r*0.04), tessellation: n*3 }, scene); ring.position.set(cx, y0 + 0.05, cz); arches.push(ring);
    add(merge(arches), whiteM);
    return y0 + h*Math.sin(Math.PI/2*0.94);
  };
  // the great dome
  const R = 15, top = dome(0, 0, R, 9.5, 4.2, 24, domeTex('chDome', 24));
  const crown = [];
  const c1 = B.MeshBuilder.CreateCylinder('chC1', { diameterTop: 4.2, diameterBottom: 3.2, height: 0.8, tessellation: 24 }, scene); c1.position.y = top + 0.3; crown.push(c1);
  const c2 = B.MeshBuilder.CreateCylinder('chC2', { diameter: 5.6, height: 0.35, tessellation: 24 }, scene); c2.position.y = top + 0.85; crown.push(c2);
  for (let i = 0; i < 8; i++){ const a = i/8*Math.PI*2, st = B.MeshBuilder.CreateCylinder('chSt', { diameter: 0.18, height: 1.2, tessellation: 4 }, scene); st.position.set(1.6*Math.cos(a), top + 1.5, 1.6*Math.sin(a)); crown.push(st); }
  const c3 = B.MeshBuilder.CreateCylinder('chC3', { diameterTop: 0.6, diameterBottom: 4, height: 0.9, tessellation: 24 }, scene); c3.position.y = top + 2.4; crown.push(c3);
  add(merge(crown), goldM);
  // four small domes in the corners
  const small = domeTex('chDomeS', 8);
  for (const [x, z] of [[-17, -17], [17, -17], [-17, 17], [17, 17]]) dome(x, z, 3.6, 2.6, 2.6, 8, small);
  // stalls: four rows (one per side, between the small domes) of open sheds with striped awnings, crates of produce
  const aw = ['#c8323a', '#e0a526', '#2f8f5b', '#2a6fb0'].map((c, i) => { const t = new B.DynamicTexture('chAw' + i, { width: 64, height: 16 }, scene, true), g = t.getContext();
    for (let k = 0; k < 8; k++){ g.fillStyle = k % 2 ? '#f6f1e6' : c; g.fillRect(k*8, 0, 8, 16); } t.update(true); t.wrapU = B.Texture.WRAP_ADDRESSMODE; return stdMat('chAwM' + i, { dt: t, spec: new C3(.1,.1,.1), power: 10 }); });
  const produce = ['#e8812a', '#c9302c', '#7ab648', '#f2c230', '#8a3c8f'].map((c, i) => stdMat('chFruit' + i, { diffuse: hex(c), spec: new C3(.2,.2,.2), power: 30 }));
  const posts = [], tables = [], awn = [[], [], [], []], crates = [[], [], [], [], []];
  let k = 0;
  for (const side of [0, 1, 2, 3]) for (let i = 0; i < 4; i++){
    const u = -9.9 + i*6.6, v = 19.2, rot = side*Math.PI/2, place = (m, lx, ly, lz) => { const c = Math.cos(rot), s = Math.sin(rot); m.position.set(lx*c + lz*s, ly, -lx*s + lz*c); m.rotation.y = rot; };
    const a = box(6.0, 0.08, 3.2, 0, 0, 0); place(a, u, 2.6, v - 0.2); a.rotation.x = 0; awn[k++ % 4].push(a);
    for (const [px, pz] of [[-2.9, -1.4], [2.9, -1.4], [-2.9, 1.2], [2.9, 1.2]]){ const p = box(0.12, 2.6, 0.12, 0, 0, 0); place(p, u + px, 1.3, v + pz); posts.push(p); }
    const tb = box(5.4, 0.9, 1.4, 0, 0, 0); place(tb, u, 0.45, v - 0.6); tables.push(tb);
    for (let j = 0; j < 5; j++){ const c = box(0.95, 0.35, 0.9, 0, 0, 0); place(c, u - 2.2 + j*1.1, 1.08, v - 0.6); crates[(i + j + side) % 5].push(c); }
  }
  add(merge(posts), stdMat('chWood', { diffuse: hex('#7a5233'), spec: new C3(.1,.1,.1) }));
  add(merge(tables), stdMat('chTable', { diffuse: hex('#a77b4f'), spec: new C3(.1,.1,.1) }));
  awn.forEach((list, i) => list.length && add(merge(list), aw[i]));
  crates.forEach((list, i) => list.length && add(merge(list), produce[i]));
  // stone paving under it all
  add(box(44, 0.12, 44, 0, -0.36, 0), stdMat('chPave', { dt: noiseTex('chp', '#d9cbb0', 0.08, 128, 2) }));
  return { P, height: top + 4 };
}

// ---- Toshkent teleminorasi (375 m, here at half height): three slender white legs leaning in to a collar, a steel
// lattice shaft, the lower pod with the observation deck and the upper pod clad in blue-green tile bands, a white
// antenna mast with small platforms. It glows amber at night like the real one.
function tvTowerParts(){
  const P = [], add = (m, mat) => { m.computeWorldMatrix(true); m.bakeCurrentTransformIntoVertices(); P.push([m, mat, null]); };
  const H = lmHeight('lm_tvtower'), f = k => k*H;

  // white concrete-and-steel with an amber floodlight wash at night

  const whiteM = nightMat('tvWhiteM', '#ebe7df', wt);

  const lt = dyn('tvLattice', 64, 128, (a, b, w, h) => { a.fillStyle = '#3f5468'; a.fillRect(0, 0, w, h); a.strokeStyle = '#c3cdd6'; a.lineWidth = 4;
    a.beginPath(); a.moveTo(0, 0); a.lineTo(w, h/2); a.lineTo(0, h); a.moveTo(w, 0); a.lineTo(0, h/2); a.lineTo(w, h); a.stroke(); a.fillStyle = '#c3cdd6'; a.fillRect(0, 0, 3, h); a.fillRect(w - 3, 0, 3, h); a.fillRect(0, h/2 - 2, w, 4);
    b.strokeStyle = '#b8621c'; b.lineWidth = 4; b.beginPath(); b.moveTo(0, 0); b.lineTo(w, h/2); b.lineTo(0, h); b.moveTo(w, 0); b.lineTo(0, h/2); b.lineTo(w, h); b.stroke();
    b.fillStyle = '#ffb04f'; for (let y = 4; y < h; y += 9){ b.fillRect(0, y, 4, 4); b.fillRect(w - 4, y, 4, 4); } for (let x = 4; x < w; x += 10) b.fillRect(x, h/2 - 2, 4, 4); });

    for (let r = 0; r < 4; r++){ const y = 10 + r*28; a.fillStyle = '#d5dde0'; a.fillRect(0, y - 4, w, 2);
      for (let x = 0; x < w; x += 16){ a.fillStyle = rowC[(r + (x/16|0)) % 4]; a.beginPath(); a.moveTo(x + 8, y); a.lineTo(x + 16, y + 10); a.lineTo(x + 8, y + 20); a.lineTo(x, y + 10); a.closePath(); a.fill(); }
      b.fillStyle = '#ffc56a'; for (let x = 4; x < w; x += 16) b.fillRect(x + 2, y + 8, 4, 4); }
    a.fillStyle = '#2b3a46'; a.fillRect(0, h - 14, w, 10); b.fillStyle = '#ffdca0'; b.fillRect(0, h - 13, w, 8); });
  pt.d.uScale = pt.e.uScale = 6;
  const podM = nightMat('tvPodM', null, pt, .5, 90);
  const steelM2 = stdMat('tvSteel', { diffuse: hex('#9aa5ae'), spec: new C3(.6,.6,.6), power: 90 });
  // a tapered member between two points
  const member = (a, b, r0, r1, n = 8) => { const d = b.subtract(a), L = d.length();
    const m = B.MeshBuilder.CreateCylinder('tvM', { height: L, diameterBottom: 2*r0, diameterTop: 2*r1, tessellation: n }, scene);
    m.position = a.add(d.scale(0.5)); const up = new V3(0, 1, 0), ax = V3.Cross(up, d.normalize()); const ang = Math.acos(clamp(V3.Dot(up, d.normalize()), -1, 1));

  const legs = [], Rf = 19, yJ = f(0.205);
  for (let i = 0; i < 3; i++){ const a = Math.PI/2 + i*2*Math.PI/3; legs.push(member(new V3(Rf*Math.cos(a), 0, Rf*Math.sin(a)), new V3(1.6*Math.cos(a), yJ, 1.6*Math.sin(a)), 0.9, 1.7)); }
  const collar = B.MeshBuilder.CreateCylinder('tvCol', { height: f(0.03), diameterBottom: 4.2, diameterTop: 9, tessellation: 24 }, scene); collar.position.y = yJ + f(0.015); legs.push(collar);
  add(merge(legs), whiteM);
  // lattice: from the ground through the collar up to the upper pod
  const latLo = B.MeshBuilder.CreateCylinder('tvL1', { height: yJ, diameter: 3.6, tessellation: 4 }, scene); latLo.position.y = yJ/2;
  const yP1 = f(0.235), yP1t = f(0.29), yP2 = f(0.6), yP2t = f(0.645);
  const latHi = B.MeshBuilder.CreateCylinder('tvL2', { height: yP2 - yP1t, diameterBottom: 5.2, diameterTop: 4.2, tessellation: 4 }, scene); latHi.position.y = (yP1t + yP2)/2;
  lt.d.uScale = lt.e.uScale = 4; lt.d.vScale = lt.e.vScale = Math.round((yP2 - yP1t)/5); add(merge([latLo, latHi]), latM);
  // pods: tiled drum between white rims, flared underside
  const pods = [], rims = [];
  for (const [y0, y1, dia] of [[yP1, yP1t, 13.6], [yP2, yP2t, 11.2]]){
    const drum = B.MeshBuilder.CreateCylinder('tvPod', { height: y1 - y0, diameterBottom: dia*0.96, diameterTop: dia, tessellation: 32 }, scene); drum.position.y = (y0 + y1)/2; pods.push(drum);
    const under = B.MeshBuilder.CreateCylinder('tvU', { height: 2.2, diameterBottom: dia*0.45, diameterTop: dia*0.96, tessellation: 32 }, scene); under.position.y = y0 - 1.1; rims.push(under);

  add(merge(arms), steelM2);

  const mast = [member(new V3(0, yP2t + 1.6, 0), new V3(0, H, 0), 1.3, 0.25, 12)];
  for (const k of [0.72, 0.8, 0.88, 0.94]){ const pl = B.MeshBuilder.CreateCylinder('tvPl', { height: 0.6, diameter: 3.4*(1.05 - k), tessellation: 12 }, scene); pl.position.y = f(k); mast.push(pl); }
  add(merge(mast), whiteM);
  const tip = B.MeshBuilder.CreateSphere('tvTip', { diameter: 1.2, segments: 6 }, scene); tip.position.y = H + 0.4;
  add(tip, (() => { const t = dyn('tvRed', 8, 8, (a, b) => { a.fillStyle = '#ff3b30'; a.fillRect(0, 0, 8, 8); b.fillStyle = '#ff2a1f'; b.fillRect(0, 0, 8, 8); }); return nightMat('tvRedM', null, t); })());

  { const m = B.MeshBuilder.CreateCylinder('tvPlaza', { height: 0.14, diameter: 44, tessellation: 40 }, scene); m.position.y = -0.35; add(m, stdMat('tvPave', { dt: noiseTex('tvp', '#d4cfc4', 0.07, 128, 2) })); }

    t.d.uScale = t.e.uScale = 3; return nightMat('tvHallM', null, t, .6, 100); })());

}

// ---- variants: one set of thin-instanced meshes per (type, style, floors, roof) or per landmark ----
const T = {};
const vkey = s => TPL[s.tpl] && TPL[s.tpl].landmark ? s.tpl : `${s.tpl}|${s.style}|${s.floors}|${s.roof}`;
function getVariant(s){
  const key = vkey(s); if (T[key]) return T[key];
  const t = TPL[s.tpl], parts = [];
  const add = (mesh, mat, colorKey) => { mesh.material = mat; mesh.isPickable = true; parts.push({ mesh, colorKey }); };
  let height;
  if (t.landmark){
    const L = landmarkParts(s.tpl); for (const [m, mat, ck] of L.P) add(m, mat, ck); height = L.height;
  } else {
    const style = s.style || 'modern', floors = s.floors || t.floors[0], w = t.w, d = t.d;
    const wallH = floors*FLOOR_H + (groupOf(s.tpl)==='shop' ? 0.6 : 0);
    add(wallBox(w, wallH, d, floors, 0), wallMatFor(style, groupOf(s.tpl)), 'wall');
    const accents = [], steel = [], orn = [];
    if (style === 'milliy'){
      orn.push(box(w+0.25, 0.9, d+0.25, 0, wallH-0.45, 0));                         // ornament band under the cornice
      orn.push(box(Math.min(3.4, w*0.45), Math.min(4.6, wallH*0.9), 0.5, 0, Math.min(4.6, wallH*0.9)/2, d/2+0.2)); // iwan portal
    } else if (style === 'hitech'){
      for (const [x,z] of [[-w/2,-d/2],[w/2,-d/2],[-w/2,d/2],[w/2,d/2]]) steel.push(box(0.35, wallH+0.6, 0.35, x, (wallH+0.6)/2, z));
      steel.push(box(w+0.2, 0.35, d+0.2, 0, wallH+0.1, 0));
    } else {
      steel.push(box(w+0.4, 0.3, d+0.4, 0, wallH, 0));
      if (s.tpl==='flat' || s.tpl==='office') for (let f=1; f<floors; f++) steel.push(box(w*0.7, 0.18, 0.9, 0, f*FLOOR_H, d/2+0.45)); // balconies
    }
    if (s.tpl==='shop' || s.tpl==='cafe'){ const aw = box(w*0.9, 0.16, 1.6, 0, 3.0, d/2+0.75); aw.rotation.x = -0.26; accents.push(aw); }
    if (orn.length) add(merge(orn), ornamentM, 'accent');
    if (steel.length) add(merge(steel), style==='hitech' ? steelM : concrete, null);
    if (accents.length) add(merge(accents), accentM, 'accent');
    const R = roofParts(s.roof || t.roofs[0], w, d, wallH + (style==='hitech'?0.25:0), style);
    for (const [m, mat, ck] of R.P) add(m, mat, ck);
    height = wallH + R.extra;
  }
  for (const pt of parts){
    pt.mesh.receiveShadows = true;
    if (pt.colorKey) pt.mesh.thinInstanceRegisterAttribute('color', 4);
    pt.mesh.thinInstanceEnablePicking = true;
    pt.mesh.alwaysSelectAsActiveMesh = true;
    pt.mesh.setEnabled(false);
    if (shadowGen) shadowGen.addShadowCaster(pt.mesh, false);
  }
  return (T[key] = { key, parts, plotsByInst: [], height });
}

// ---------- trees & lamps ----------
// ---------- trees: four real kinds, each with a detailed near model and a light far model (distance LOD) ----------
// chinor (plane tree, broad lumpy crown), terak (poplar, tall and narrow), archa (fir, tiered cones), fruit tree (blossom).
// Colours are baked as vertex colours (bark brown, leaves darker inside / lighter on top); the per-tree instance colour
// only varies the shade (or gives a fruit tree its blossom colour).
function vcol(mesh, fn){
  const p = mesh.getVerticesData(B.VertexBuffer.PositionKind), c = [];
  let y0 = 1e9, y1 = -1e9; for (let i = 1; i < p.length; i += 3){ y0 = Math.min(y0, p[i]); y1 = Math.max(y1, p[i]); }
  for (let i = 0; i < p.length; i += 3){ const k = (p[i+1]-y0)/((y1-y0) || 1), col = fn(k, p[i], p[i+1], p[i+2]); c.push(col[0], col[1], col[2], 1); }
  mesh.setVerticesData(B.VertexBuffer.ColorKind, c); return mesh;
}
function lumpy(m, amt){ // jitter a blob so a crown is not a perfect ball
  const p = m.getVerticesData(B.VertexBuffer.PositionKind);
  for (let i = 0; i < p.length; i += 3){ const s = 1 + (Math.sin(p[i]*7.1 + p[i+2]*3.7) * 0.5 + Math.sin(p[i+1]*5.3 + p[i]*2.1) * 0.5)*amt; p[i] *= s; p[i+1] *= s; p[i+2] *= s; }
  m.updateVerticesData(B.VertexBuffer.PositionKind, p); m.createNormals(true); return m;
}
const BARK = [0.33, 0.24, 0.17];
function treeModel(kind, near){
  const parts = [];
  const trunk = (h, r0, r1, tess) => { const t = B.MeshBuilder.CreateCylinder('tr', { diameterTop: r1*2, diameterBottom: r0*2, height: h, tessellation: tess, cap: B.Mesh.NO_CAP }, scene); t.position.y = h/2; t.bakeCurrentTransformIntoVertices(); parts.push(vcol(t, () => BARK)); };
  const blob = (x, y, z, r, sx, sy, sz, sub, green, amt) => {
    const b = B.MeshBuilder.CreateIcoSphere('bl', { radius: r, subdivisions: sub, flat: false, updatable: true }, scene);
    lumpy(b, amt); b.scaling.set(sx, sy, sz); b.position.set(x, y, z); b.bakeCurrentTransformIntoVertices();
    parts.push(vcol(b, (k) => { const f = 0.62 + 0.5*k; return [green[0]*f, green[1]*f, green[2]*f]; }));
  };
  const branch = (len, ang, rot, y) => { const b = B.MeshBuilder.CreateCylinder('br', { diameterTop: 0.08, diameterBottom: 0.16, height: len, tessellation: 4, cap: B.Mesh.NO_CAP }, scene);
    b.position.y = len/2; b.bakeCurrentTransformIntoVertices(); b.rotation.set(0, rot, ang); b.position.y = y; b.bakeCurrentTransformIntoVertices(); parts.push(vcol(b, () => BARK)); };
  if (kind === 'broad'){                                   // chinor: short thick trunk, forked branches, broad lumpy dome
    const G = [0.27, 0.47, 0.2];
    if (near){
      trunk(3.0, 0.24, 0.17, 7); branch(1.9, 0.6, 0.3, 2.4); branch(1.8, 0.7, 2.4, 2.5); branch(1.6, 0.55, 4.3, 2.6);
      blob(0, 4.6, 0, 1.9, 1.15, 0.85, 1.1, 1, G, 0.12); blob(1.3, 4.0, 0.5, 1.45, 1, 0.85, 1, 1, G, 0.14); blob(-1.2, 4.1, -0.6, 1.5, 1, 0.85, 1, 1, G, 0.14);
      blob(0.3, 3.9, -1.3, 1.3, 1, 0.85, 1, 1, G, 0.14); blob(-0.5, 5.5, 0.4, 1.3, 1, 0.9, 1, 1, G, 0.14); blob(0.6, 4.2, 1.4, 1.2, 1, 0.85, 1, 1, G, 0.14);
    } else { trunk(3.0, 0.24, 0.17, 4); blob(0, 4.5, 0, 2.4, 1.15, 0.85, 1.15, 1, G, 0.1); }
  } else if (kind === 'poplar'){                           // terak: slim columnar crown along Uzbek roads
    const G = [0.3, 0.5, 0.22];
    if (near){ trunk(2.2, 0.17, 0.12, 6); blob(0, 3.4, 0, 1.15, 1, 1.5, 1, 1, G, 0.16); blob(0.1, 5.4, -0.05, 1.0, 1, 1.7, 1, 1, G, 0.16); blob(-0.05, 7.4, 0.05, 0.75, 1, 1.6, 1, 1, G, 0.16); }
    else { trunk(2.2, 0.17, 0.12, 4); blob(0, 5.2, 0, 1.1, 1, 3.2, 1, 1, G, 0.08); }
  } else if (kind === 'pine'){                             // archa: tiers of drooping cones
    const G = [0.13, 0.32, 0.17];
    trunk(near ? 2.4 : 2.0, 0.22, 0.12, near ? 6 : 4);
    const tiers = near ? [[2.6, 3.0, 1.3], [2.1, 2.8, 3.0], [1.6, 2.5, 4.6], [1.05, 2.2, 6.0], [0.55, 1.8, 7.3]] : [[2.4, 4.6, 1.3], [1.5, 4.2, 4.4]];
    for (const [r, h, y] of tiers){ const c = B.MeshBuilder.CreateCylinder('pc', { diameterTop: 0, diameterBottom: r*2, height: h, tessellation: near ? 8 : 6 }, scene); c.position.y = y + h/2; c.bakeCurrentTransformIntoVertices();
      parts.push(vcol(c, (k, x, yy, z) => { const f = 0.55 + 0.6*k + (Math.hypot(x, z) > r*0.6 ? 0.08 : 0); return [G[0]*f, G[1]*f, G[2]*f]; })); }
  } else {                                                 // fruit tree: low, round crown — white so the blossom colour shows
    const W = [0.95, 0.93, 0.92];
    trunk(1.6, 0.13, 0.1, near ? 6 : 4);
    if (near){ blob(0, 2.6, 0, 1.25, 1.1, 0.85, 1.1, 1, W, 0.14); blob(0.7, 2.3, 0.3, 0.9, 1, 0.85, 1, 1, W, 0.16); blob(-0.6, 2.4, -0.4, 0.95, 1, 0.85, 1, 1, W, 0.16); }
    else blob(0, 2.5, 0, 1.5, 1.15, 0.85, 1.15, 1, W, 0.1);
  }
  const m = B.Mesh.MergeMeshes(parts, true, true); m.name = 'tree_' + kind + (near ? '_n' : '_f');
  m.material = treeMat; m.isPickable = false; m.receiveShadows = true;
  return m;
}
const treeMat = stdMat('treeM', { diffuse: new C3(1,1,1), spec: new C3(0.04, 0.04, 0.04) });
const TREE_NEAR = 560;
const TREES = {};
for (const [kind, far] of [['broad', 1700], ['poplar', 1700], ['pine', 1900], ['fruit', 1200]]){
  TREES[kind] = { near: chunkSet(treeModel(kind, true), TREE_NEAR, ['color'], 0, true), far: chunkSet(treeModel(kind, false), far, ['color'], TREE_NEAR) };
}
// x, z, size, kind ('broad' | 'poplar' | 'pine' | 'fruit'), optional instance colour (a fruit tree's blossom)
function addTree(x, z, s, kind = 'broad', color = null){
  const m = B.Matrix.Compose(new V3(s, s*(0.88 + rnd()*0.3), s), B.Quaternion.RotationAxis(V3.Up(), rnd()*6.28), new V3(x, 0.3, z));
  const g = 0.86 + rnd()*0.28, col = color ? [...color, 1] : [g*(0.96 + rnd()*0.08), g, g*(0.92 + rnd()*0.1), 1];
  for (const set of [TREES[kind].near, TREES[kind].far]){ const r = set.add(m, x, z); r.c.mesh.thinInstanceSetAttributeAt('color', r.i, col, false); }
}
const flushTrees = () => { for (const k in TREES){ TREES[k].near.flush(); TREES[k].far.flush(); } };
const treeCasters = () => Object.values(TREES).flatMap(t => t.near.meshes());

// park trees
for (let i=0;i<190;i++){
  const x = lerp(parkMin.x+3, parkMax.x-3, rnd()), z = lerp(parkMin.z+3, parkMax.z-3, rnd());
  if (Math.hypot(x-parkC.x, z-parkC.z) < 16 || Math.abs(x-parkC.x)<4 || Math.abs(z-parkC.z)<4) continue;
  addTree(x,z,0.9+rnd()*0.6);
}
// street trees along block edges (denser in the old centre)
for (const bl of blocks){
  const x0 = blockX(bl.bx), z0 = blockZ(bl.bz), pr = inCore(bl.bx,bl.bz) ? 0.55 : 0.3;
  for (let t=6; t<BLK-4; t+=9){
    if (rnd()<pr) addTree(x0+t, z0+1.1, 0.6+rnd()*0.25, rnd() < 0.3 ? 'poplar' : 'broad');
    if (rnd()<pr) addTree(x0+t, z0+BLK-1.1, 0.6+rnd()*0.25, rnd() < 0.3 ? 'poplar' : 'broad');
  }
}
// small parks
for (const sp of smallParks) for (let i=0;i<14;i++) addTree(sp.cx + (rnd()-0.5)*(BLK-6), sp.cz + (rnd()-0.5)*(BLK-6), 0.8+rnd()*0.5);
// countryside groves east and west of the city, and behind the airport
for (let i=0;i<1400;i++){
  const x = lerp(LAND.x0+200, LAND.x1-200, rnd()), z = lerp(AIR.z-1400, COAST_Z-40, rnd());
  if (x > X0-30 && x < X0+W+30 && z > AIR.z-330 && z < COAST_Z) continue;   // city, port, airport strip
  if (Math.abs(x) > 2600 && rnd() < 0.6) continue;
  if (distToRiver(x, z) < 45) continue;
  if (x > DEALER.x0 - 8 && x < DEALER.x1 + 12 && z > DEALER.z0 - 12 && z < DEALER.z1 + 12) continue;   // the dealership lot
  addTree(x, z, 0.9+rnd()*0.9, rnd() < 0.25 ? 'poplar' : rnd() < 0.2 ? 'pine' : 'broad');
}
flushTrees();

// lamps at block corners
const poleBase = B.MeshBuilder.CreateCylinder('pole',{diameter:0.18,height:6,tessellation:4,cap:B.Mesh.NO_CAP},scene); poleBase.position.y=3; poleBase.bakeCurrentTransformIntoVertices();
poleBase.material = stdMat('poleM',{diffuse:hex('#2b2f36')}); poleBase.isPickable=false;
const bulbBase = B.MeshBuilder.CreateBox('bulb',{width:0.6,height:0.5,depth:0.6},scene); bulbBase.position.y=6.1; bulbBase.bakeCurrentTransformIntoVertices();
mats.bulb = stdMat('bulbM',{diffuse:hex('#fff2cc'), emissive:new C3(0,0,0)}); bulbBase.material = mats.bulb; bulbBase.isPickable=false;
const poles = chunkSet(poleBase, 750), bulbs = chunkSet(bulbBase, 1100);
for (const bl of blocks){
  const x0 = blockX(bl.bx), z0 = blockZ(bl.bz);
  for (const [dx,dz] of [[0.8,0.8],[BLK-0.8,0.8],[0.8,BLK-0.8],[BLK-0.8,BLK-0.8]]){

const FLIP_WIND = false;
function solidFromRings(A, Bq, name, uvScale){
  const n = A.length, all = [...A, ...Bq], pos = [], idx = [];

  const C = all.reduce((s, v) => s.addInPlace(v), V3.Zero()).scale(1/all.length);

    const va = all[a], vb = all[b], vc = all[c], nrm = V3.Cross(vb.subtract(va), vc.subtract(va)), mid = va.add(vb).add(vc).scale(1/3);
    if ((V3.Dot(nrm, mid.subtract(C)) > 0) !== FLIP_WIND) idx.push(a, c, b); else idx.push(a, b, c);
  };

  for (let i = 0; i < n; i++){ const j = (i+1) % n; tri(i, j, n+j); tri(i, n+j, n+i); }

  vd.positions = pos; vd.indices = idx;
  { const us = uvScale || [10, 10], uv = []; for (const v of all) uv.push((v.x + v.z)/us[0], v.y/us[1]); vd.uvs = uv; }   // uvs always: merged meshes need the same attributes

const prismY = (outline, y0, y1, name, uv) => solidFromRings(outline.map(([x,z]) => new V3(x, y0, z)), outline.map(([x,z]) => new V3(x, y1, z)), name, uv);
// outline in the x–y plane (convex) extruded across z
const prismZ = (outline, z0, z1, name) => solidFromRings(outline.map(([x,y]) => new V3(x, y, z0)), outline.map(([x,y]) => new V3(x, y, z1)), name);

function loftSide(prof, wb, wt, name){
  const ys = prof.map(p => p[1]), y0 = Math.min(...ys), y1 = Math.max(...ys);

// ---------- ships: a real hull (ribbon of cross-sections), modelled along +x, waterline at y = 0 ----------
function hullMesh(o){
  const { L, Bm, D, draft, bowLen, sternLen = 0.05, colTop, colBottom, bottomTo = 1.4, band, name } = o;
  const prof = [[1,1],[1,0.6],[0.98,0.3],[0.88,0.1],[0.5,0.0],[0,0]];
  const pts = [...prof, ...prof.slice(0, -1).reverse().map(([w,h]) => [-w, h])];
  const paths = pts.map(() => []), N = 40;
  for (let i = 0; i <= N; i++){
    const t = i/N, x = -L/2 + t*L;
    let hw = Bm/2, rise = 0;
    if (t > 1-bowLen){ const u = (t-(1-bowLen))/bowLen; hw *= Math.sqrt(Math.max(0, 1-u*u)); rise = u*u*D*0.45; }
    if (t < sternLen){ const u = 1 - t/sternLen; hw *= o.doubleEnded ? Math.sqrt(Math.max(0, 1-u*u)) : 1 - 0.12*u; if (o.doubleEnded) rise = u*u*D*0.45; }

  }
  const hull = B.MeshBuilder.CreateRibbon(name+'Hull', { pathArray: paths, sideOrientation: B.Mesh.DOUBLESIDE }, scene);
  const p = hull.getVerticesData('position'), cols = [];
  const cT = hex(colTop), cB = hex(colBottom), cBand = band ? hex(band.c) : null;
  for (let i = 0; i < p.length; i += 3){
    const y = p[i+1], c = y < bottomTo ? cB : (band && y > band.y0 && y < band.y1 ? cBand : cT);
    cols.push(c.r, c.g, c.b, 1);
  }
  hull.setVerticesData(B.VertexBuffer.ColorKind, cols);
  const deck = B.MeshBuilder.CreateRibbon(name+'Deck', { pathArray: [paths[0], paths[paths.length-1]], sideOrientation: B.Mesh.DOUBLESIDE }, scene);
  const deckY = (t) => { const k = Math.round(t*N); return paths[0][k].y; };
  const hwAt = (t) => { const k = Math.round(Math.max(0, Math.min(1, t))*N); return Math.abs(paths[0][k].z); };
  return { hull, deck, deckY, hwAt, freeboard: D - draft };
}

  const sm = (a, b, v) => { const k = Math.min(1, Math.max(0, (v-a)/(b-a))); return k*k*(3-2*k); };
  const t = waterClock(), fade = (1 - Math.min(1, Math.max(0, (Math.hypot(x - seaGrid.position.x, z - seaGrid.position.z)/SEA_HALF - SEA_FADE0)/(1 - SEA_FADE0)))) * sm(COAST_Z + 10, COAST_Z + 140, z);
  const fx = Math.cos(yaw), fz = -Math.sin(yaw), half = len*0.3;
  const a = swellAt(x + fx*half, z + fz*half, t), b = swellAt(x - fx*half, z - fz*half, t), m = swellAt(x, z, t);
  n.position.y = WATER_Y + (a.h + b.h + m.h)/3*fade*0.8;
  n.rotation.z = Math.atan2((a.h - b.h)*fade, 2*half)*0.8;                       // pitch
  n.rotation.x = -(m.dx*fz*-1 + m.dz*fx)*fade*0.25;                               // gentle roll
}
function updateShips(dt){

    const p1 = [px + (ax-px)/la*rr, pz + (az-pz)/la*rr], p2 = [px + (cx-px)/lc*rr, pz + (cz-pz)/lc*rr];
    push(p1[0], p1[1]);

      pitchT = p.s < 60 ? (6.5*(1 - p.s/60))*Math.PI/180 : 0;            // nose-wheel comes down after touchdown
      if (left < 0.5){ p.st = 'park'; p.t = 0; p.v = 0; }
      break;
    }
    case 'park': if (p.t > 18){ p.st = 'push'; p.s = 0; } break;
    case 'push': {                                       // push-back, tail first, 2.5 m/s
      p.v = 2.5; p.s += p.v*dt; followPath = p.pushPath; reverse = true;
      if (p.s >= p.pushPath.len){ p.st = 'pause'; p.t = 0; }
      break;
    }
    case 'pause': if (p.t > 4){ p.st = 'out'; p.s = 0; p.cleared = false; } break;
    case 'out': {                                        // taxi out, hold short until the runway is free
      let v = G.taxiV;
      if (!p.cleared && p.s >= p.holdS - 1){ if (others.some(o => onRunwayArrival(o) || onRunwayDeparture(o))) v = 0; else p.cleared = true; }
      if (!p.cleared) v = Math.min(v, Math.sqrt(2*1.2*Math.max(0, p.holdS - p.s)));
      const left = p.outPath.len - p.s; v = Math.min(v, Math.sqrt(2*1.2*Math.max(0, left)) + 0.2);
      if (groundTraffic(p)) v = 0;
      p.v += Math.max(-4*dt, Math.min(1.5*dt, v - p.v)); p.s += p.v*dt; followPath = p.outPath;
      if (left < 0.5){ p.st = 'lineup'; p.t = 0; p.v = 0; }
      break;
    }
    case 'lineup': yawT = Math.PI; if (p.t > 4){ p.st = 'takeoff'; p.v = 0; } break;
    case 'takeoff': {                                    // full-power roll, rotation, lift-off, initial climb
      p.v = Math.min(G.climbV, p.v + G.accel*dt); p.x -= p.v*dt; yawT = Math.PI;
      if (p.v > G.rotateV) pitchT = Math.min(9, (p.v - G.rotateV)*2.2)*Math.PI/180;
      if (p.v >= G.liftV){ p.vy = (p.vy || 0) + 2.2*dt; p.vy = Math.min(p.vy, p.v*Math.sin(7*Math.PI/180)); p.y += p.vy*dt; pitchT = 11*Math.PI/180; }
      if (p.y > 35){ p.st = 'climb'; p.t = 0; }
      break;
    }
    case 'climb': {                                      // climb-out, then a gentle banked turn to the south-west over the sea
      p.v = Math.min(G.climbV + 10, p.v + 1*dt);
      const turnRate = (p.t > 9 && p.t < 25) ? 2.4*Math.PI/180 : 0;      // yaw increasing = turning left, towards +z (out over the sea)
      p.yaw += turnRate*dt; yawT = p.yaw;
      bankT = -Math.sign(turnRate)*0.36;                                  // bank into the turn (local +x roll lifts the right wing)
      p.vy = Math.min(p.v*Math.sin(7*Math.PI/180), (p.vy || 0) + 1*dt);
      p.x += Math.cos(p.yaw)*p.v*dt; p.z += -Math.sin(p.yaw)*p.v*dt; p.y += p.vy*dt; pitchT = 10*Math.PI/180;
      if (p.t > 60){ p.st = 'away'; p.t = 0; p.shown = false; }
      break;
    }
    case 'away': {                                       // re-enters on final when the runway is free
      if (p.t > 25 && !others.some(o => onRunwayDeparture(o) || o.st === 'approach')){ p.st = 'approach'; p.s = 0; p.shown = true; p.vy = 0; p.yaw = Math.PI; }
      break;
    }
  }
  if (followPath){
    const q = followPath.at(p.s); p.x = q.x; p.z = q.z; p.y = 0.25;
    yawT = reverse ? Math.atan2(q.dz, -q.dx) : Math.atan2(-q.dz, q.dx);
  }
  // smooth attitude: yaw follows the track, pitch and bank ease in
  let dy = yawT - p.yaw; while (dy > Math.PI) dy -= 2*Math.PI; while (dy < -Math.PI) dy += 2*Math.PI;
  p.yaw += dy*Math.min(1, dt*(followPath ? 12 : 3));
  p.pitch += (pitchT - p.pitch)*Math.min(1, dt*1.6);
  p.bank += (bankT - p.bank)*Math.min(1, dt*1.2);
  const n = p.root;
  n.setEnabled(p.shown);
  n.position.set(p.x, p.y, p.z);
  B.Quaternion.RotationAxisToRef(V3.Up(), p.yaw, n.rotationQuaternion);
  n.rotationQuaternion.multiplyInPlace(B.Quaternion.RotationAxis(B.Axis.Z, p.pitch)).multiplyInPlace(B.Quaternion.RotationAxis(B.Axis.X, p.bank));
}

// ---------- owner name over every building (Telegram @username, otherwise the nickname) ----------
// HTML labels over the 3D view: always crisp, always the same size on screen, near or far.
// Every 250 ms the nearest labels are picked and those that would overlap a nearer one are dropped,
// so a far view of the whole city stays readable; own plots and the selected plot always win.
const LBL = { on:true, max:140, px:26 };
const lblLayer = document.createElement('div'); lblLayer.id = 'labels'; document.body.insertBefore(lblLayer, document.getElementById('top'));
const labelY = p => 0.42 + (p.tpl && T[p.vkey] ? T[p.vkey].height : 0) + 2.5;
const TG_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#2AABEE"/><path d="M5.5 11.8l11-4.3c.5-.2 1 .1.8.9l-1.9 8.8c-.1.6-.5.8-1 .5l-2.8-2.1-1.4 1.3c-.2.2-.3.3-.6.3l.2-2.9 5.3-4.8c.2-.2 0-.3-.3-.1l-6.6 4.1-2.8-.9c-.6-.2-.6-.6.1-.8z" fill="#fff"/></svg>';
function setLabel(p){
  let text = p.owner ? (p.ownerTg ? '@' + p.ownerTg : p.owner) : null;
  if (!p.tpl && p.owner === 'Shahar hokimligi') text = null;          // city land around a skyscraper: no tag
  if (text && p.tpl && TPL[p.tpl] && TPL[p.tpl].landmark){ // landmarks: the building's name first
    const nm = TPL[p.tpl].name.replace(/ \(.*\)$/, '');
    text = p.owner === 'Shahar hokimligi' ? nm : `${nm} · ${text}`;
  }
  if (!text){ p.lbl = null; return; }
  const kind = p.state==='mine' ? 'mine' : p.ownerTg ? 'tg' : 'nick';
  const bp = bpos(p);
  p.lbl = { text, kind, pos: new V3(bp.x, labelY(p), bp.z), key: kind + '|' + text };
}
const lblPool = [];
function lblEl(i){
  while (lblPool.length <= i){ const d = document.createElement('div'); d.className = 'olbl'; d.style.display = 'none'; lblLayer.appendChild(d); lblPool.push(d); }
  return lblPool[i];
}
let lblTimer = 0, lblShown = [];
const _proj = new V3();
function projectLbl(p){
  const k = engine.getHardwareScalingLevel(), vp = camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight());
  V3.ProjectToRef(p.lbl.pos, B.Matrix.IdentityReadOnly, scene.getTransformMatrix(), vp, _proj);
  return { x: _proj.x*k, y: _proj.y*k, z: _proj.z };
}
function updateLabels(dt){
  lblTimer -= dt;
  if (lblTimer <= 0){
    lblTimer = 0.25;
    lblShown = [];
    if (LBL.on){
      const camPos = camera.position, all = [];
      for (const p of plots) if (p.lbl){ p._ld = V3.Distance(camPos, p.lbl.pos); if (p._ld < 3200 || p === S.selected) all.push(p); }   // far away (e.g. behind the mountains): no tag
      const prio = p => (p === S.selected) * 2 + (p.state === 'mine');
      all.sort((a,b) => prio(b) - prio(a) || a._ld - b._ld);
      const taken = [], W = canvas.clientWidth, H = canvas.clientHeight;
      for (const p of all){
        if (lblShown.length >= LBL.max) break;
        const s = projectLbl(p);
        if (s.z < 0 || s.z > 1 || s.x < -60 || s.y < -30 || s.x > W+60 || s.y > H+30) continue;
        const hw = Math.min(230, p.lbl.text.length*7.4 + (p.lbl.kind==='tg'?40:22))/2 + 3, hh = LBL.px/2 + 2, cy = s.y - LBL.px/2;
        if (prio(p) === 0 && taken.some(r => Math.abs(r.x-s.x) < r.hw+hw && Math.abs(r.y-cy) < r.hh+hh)) continue;
        taken.push({ x:s.x, y:cy, hw, hh }); lblShown.push(p);
      }
    }
    for (let i = 0; i < lblPool.length; i++) if (i >= lblShown.length) lblPool[i].style.display = 'none';
    lblShown.forEach((p, i) => {
      const el = lblEl(i);
      if (el._key !== p.lbl.key){
        el._key = p.lbl.key; el.className = 'olbl ' + p.lbl.kind;
        el.innerHTML = (p.lbl.kind==='tg' ? TG_ICON : p.lbl.kind==='mine' ? '<i></i>' : '') + '<span></span>';
        el.lastChild.textContent = p.lbl.text;
      }
      el.style.display = '';
    });
  }
  // follow the camera every frame
  for (let i = 0; i < lblShown.length; i++){
    const p = lblShown[i]; if (!p.lbl) continue;
    const s = projectLbl(p), el = lblPool[i];
    if (s.z < 0 || s.z > 1){ el.style.visibility = 'hidden'; continue; }
    el.style.visibility = '';
    el.style.transform = `translate3d(${s.x.toFixed(1)}px,${s.y.toFixed(1)}px,0) translate(-50%,-100%)`;
  }
}

async function bindSell(p){

async function buy(p, price){

let ghost = [];

function makeGhost(b){

  for (const pt of t.parts){
    const g = new B.Mesh('ghost', scene);
    pt.mesh.geometry.applyToMesh(g);
    const m = new B.StandardMaterial('gm', scene);
    m.alpha = 0.55; m.specularColor = new C3(.1,.1,.1);
    const src = pt.mesh.material;
    m.diffuseColor = pt.colorKey==='wall' ? hex(b.color) : pt.colorKey==='accent' ? hex(b.accent) : (src.diffuseColor ? src.diffuseColor.clone() : new C3(.75,.72,.68));

    m.emissiveColor = new C3(.08,.25,.22);

    g.position.set(b.p.x,0.42,b.p.z); g.rotation.y = b.rot*Math.PI/2;
    ghost.push(g);
  }
}

// ---------- find land ----------
function findLand(){
  const tx = camera.target.x, tz = camera.target.z;
  const minBuild = z => Math.min(...templatesFor(z).map(k=>minCost(k)));
  const cand = plots.filter(p=>p.state==='empty' && landPrice(p)+minBuild(p.zone)<=S.coins)
    .map(p=>({p, d:Math.hypot(p.x-tx,p.z-tz)})).sort((a,b)=>a.d-b.d);
  if (!cand.length){ toast(myPlots().length>=S.limit?'Uchastkalar limitiga yetdingiz.':'Mos bo‘sh yer topilmadi.'); return; }
  if (myPlots().length>=S.limit){ toast(`Ko‘pi bilan ${S.limit} ta uchastka olish mumkin.`); return; }
  const p = cand[0].p;
  flyTo(p.x,p.z,85,0.95);
  showPlot(p);
}

// ---------- quality ----------
let shadowGen = null, pipeline = null, glow = null;
const casters = () => {
  const list = [...treeCasters(), ...poles.meshes(), basin, jet, ...[...CARS.values()].flatMap(c => c.node ? c.node.getChildMeshes() : []), ...DLR.casters()];
  for (const t of Object.values(T)) for (const pt of t.parts) list.push(pt.mesh);
  return list;
};
const isMobile = matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad/i.test(navigator.userAgent);
if (isMobile){ LBL.max = 45; }
function autoStart(){ return isMobile ? 'low' : 'medium'; }
function applyQuality(q){
  S.qActive = q;
  if (shadowGen){ shadowGen.dispose(); shadowGen = null; }
  if (pipeline){ pipeline.dispose(); pipeline = null; }
  if (glow){ glow.dispose(); glow = null; }
  const dpr = window.devicePixelRatio || 1;
  const cap = q==='low' ? 1 : q==='medium' ? 1.5 : 2;
  engine.setHardwareScalingLevel(1 / Math.min(dpr, cap) * (q==='low' && dpr<1.2 ? 1.15 : 1));
  const webgl2 = engine.webGLVersion >= 2;
  if (q==='medium'){
    shadowGen = new B.ShadowGenerator(2048, sun);
    if (webgl2){ shadowGen.usePercentageCloserFiltering = true; shadowGen.filteringQuality = B.ShadowGenerator.QUALITY_LOW; }
    else shadowGen.useBlurExponentialShadowMap = true;
    shadowGen.bias = 0.0008; shadowGen.normalBias = 0.02; shadowGen.darkness = 0.25;
  } else if (q==='high'){
    if (webgl2){
      shadowGen = new B.CascadedShadowGenerator(2048, sun);
      shadowGen.numCascades = 4; shadowGen.lambda = 0.85; shadowGen.shadowMaxZ = 700;
      shadowGen.stabilizeCascades = true; shadowGen.filteringQuality = B.ShadowGenerator.QUALITY_MEDIUM;
      shadowGen.usePercentageCloserFiltering = true; shadowGen.autoCalcDepthBounds = false;
      shadowGen.bias = 0.002; shadowGen.normalBias = 0.02; shadowGen.darkness = 0.2;
    } else {
      shadowGen = new B.ShadowGenerator(4096, sun); shadowGen.useBlurExponentialShadowMap = true; shadowGen.darkness=.2;
    }
  }
  if (shadowGen){ for (const m of casters()) shadowGen.addShadowCaster(m, false); }
  if (q!=='low'){
    pipeline = new B.DefaultRenderingPipeline('pp', true, scene, [camera]);
    pipeline.fxaaEnabled = true;
    pipeline.imageProcessingEnabled = true;
    pipeline.imageProcessing.toneMappingEnabled = true;
    pipeline.imageProcessing.toneMappingType = B.ImageProcessingConfiguration.TONEMAPPING_ACES;
    pipeline.imageProcessing.exposure = 1.15;
    pipeline.imageProcessing.contrast = 1.18;
    if (q==='high'){
      pipeline.samples = 4;
      pipeline.bloomEnabled = true; pipeline.bloomThreshold = 0.75; pipeline.bloomWeight = 0.35; pipeline.bloomKernel = 48; pipeline.bloomScale = 0.5;
      pipeline.imageProcessing.vignetteEnabled = true; pipeline.imageProcessing.vignetteWeight = 1.4;
      glow = new B.GlowLayer('glow', scene, { blurKernelSize: 32, mainTextureRatio: 0.5 });
      glow.intensity = 0.6;
      for (const m of [...bulbs.meshes(), ...dots.meshes(), ...sigLamps.flatMap(l => l.meshes()), ...carLights, ...AIR_LIGHTS]) glow.addIncludedOnlyMesh(m);
    }
  }
  scene.fogDensity = q==='low' ? 0.00034 : 0.00028;
  carsVisible = q==='low' ? 140 : q==='medium' ? 280 : CAR_N;
  LOD.k = q==='low' ? 0.7 : q==='medium' ? 1 : 1.35; lodT = 0;
  // weakest phones: no moving swell grid, the flat sea (still rippled, with glints) comes up to the waterline
  seaGrid.setEnabled(q !== 'low'); lake.position.y = q === 'low' ? SEA_Y : -2.6;
}

// ---------- day / night ----------
const SKY_NIGHT = new C3(.05,.08,.17), SKY_DAY = new C3(.55,.74,.93), SKY_DUSK = new C3(.98,.55,.32);
// sky dome palettes: [top, horizon]
const SKY = { day:[hex('#3f7fd4'), hex('#c3dcef')], dusk:[hex('#3b3a78'), hex('#f3a467')], night:[hex('#060a1a'), hex('#1b2342')] };
const WARM = new C3(1,.86,.62);
function clockStr(){ const h=Math.floor(S.hours)%24, m=Math.floor((S.hours%1)*60); return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
const tmpDir = new V3();
function updateSky(){
  const ang = (S.hours-6)/12*Math.PI;
  const sx = Math.cos(ang), sy = Math.sin(ang);
  const elev = sy;
  const day = smooth(-0.12, 0.3, elev);
  const dusk = Math.exp(-Math.pow(elev/0.2,2));
  const night = 1 - smooth(-0.06, 0.18, elev);
  // light direction: sun by day, moon by night
  if (elev > -0.02){ tmpDir.set(-sx, -Math.max(sy,0.06), -0.45); }
  else { tmpDir.set(sx, sy, -0.6); tmpDir.y = -Math.max(-sy,0.25); }
  tmpDir.normalize(); sun.direction.copyFrom(tmpDir);
  // shadows follow the view: a fixed square around the camera target (the city is too big for one map)
  sun.position.set(camera.target.x - tmpDir.x*1200, -tmpDir.y*1200, camera.target.z - tmpDir.z*1200);
  sun.shadowFrustumSize = clamp(camera.radius*2.4, 260, 2200);
  const sunI = elev > -0.02 ? 0.25 + 2.1*smooth(-0.02,0.35,elev) : 0.45*smooth(0, 0.3, -elev);
  sun.intensity = sunI;
  sun.diffuse = elev>-0.02 ? C3.Lerp(new C3(1,.62,.38), new C3(1,.97,.9), smooth(0,0.45,elev)) : new C3(.55,.65,1);
  hemi.intensity = 0.32 + 0.45*day;
  hemi.diffuse = C3.Lerp(new C3(.42,.52,.85), new C3(.95,.97,1), day);
  let sky = C3.Lerp(SKY_NIGHT, SKY_DAY, day);
  sky = C3.Lerp(sky, SKY_DUSK, dusk*0.55*(elev>-0.25?1:0));
  const dk = dusk*(elev>-0.3?1:0);
  let top = C3.Lerp(SKY.night[0], SKY.day[0], day), hor = C3.Lerp(SKY.night[1], SKY.day[1], day);
  top = C3.Lerp(top, SKY.dusk[0], dk*0.8); hor = C3.Lerp(hor, SKY.dusk[1], dk*0.9);
  skyMat.setColor3('topC', top); skyMat.setColor3('horC', hor); skyMat.setColor3('lowC', C3.Lerp(hor, hex('#0b1424'), 0.6));
  skyMat.setVector3('sunDir', new V3(-sx, Math.max(sy, -0.2), -0.45));
  skyMat.setColor3('sunC', C3.Lerp(hex('#ff9a4a'), hex('#fff4d6'), smooth(0, 0.5, elev)).scale(elev > -0.1 ? 1 : 0));
  skyMat.setFloat('glow', 0.4 + dk*1.6); skyMat.setFloat('stars', night);
  scene.clearColor = new C4(hor.r, hor.g, hor.b, 1);
  scene.fogColor = C3.Lerp(hor, sky, 0.35);
  { const sk = C3.Lerp(top, hor, 0.6); for (const m of [mats.lake, mats.sea, riverM]) m.emissiveColor = sk.scale(m.waterEmissiveK); }
  mats.dot.emissiveColor = hex('#ffcf73').scale(0.15 + night*2.1);
  if (mats.snow) mats.snow.diffuseColor = C3.Lerp(hex('#3a4160'), hex('#f4f1f6'), Math.max(day, dk*0.8)).add(hex('#3a1e10').scale(dk*0.5));
  // windows & lamps
  const ei = night*1.7;                              // windows: brighter at night
  for (const m of nightMats) m.emissiveTexture.level = ei;
  mats.bulb.emissiveColor = WARM.scale(night*2.4);
  for (const [m, c, k] of AIR_GLOW) m.emissiveColor = c.scale(night*k);
  if (glow) glow.intensity = 1.15*night;
  mats.mountain.diffuseColor = C3.Lerp(hex('#1c2034'), hex('#6b6f86'), day).add(hex('#4a2a3a').scale(dk*0.5));
  $('#clock').textContent = clockStr();
  $('#clockIcon').textContent = elev>0.05 ? '☀' : elev>-0.12 ? '◐' : '☾';
}

// ---------- camera controls (map style) ----------
// 1 finger / left mouse: grab-pan anywhere · 2 fingers: pinch zoom, twist rotate, parallel vertical drag tilts
// right mouse / Ctrl+left: orbit + tilt · wheel: zoom to cursor · keys: WASD/arrows, Q/E, R/F, +/-
// Rotation pivot = selected plot (if any), otherwise the point between the fingers / screen centre.
const LIM = { x0: FOREST.x0, x1: FOREST.x1, z0: FOREST.z0, z1: COAST_Z+700 };
const ptrs = new Map();
let gest = null, tapStart = null;
const vel = { x:0, z:0 };
const rel = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
function groundAt(x, y){
  camera.getViewMatrix(true);
  const ray = scene.createPickingRay(x, y, B.Matrix.Identity(), camera, false);
  if (ray.direction.y > -0.02) return null;               // looking above the horizon
  const t = Math.min(-ray.origin.y / ray.direction.y, 9000);
  return new V3(ray.origin.x + ray.direction.x*t, 0, ray.origin.z + ray.direction.z*t);
}
function moveTarget(dx, dz){
  camera.target.x = clamp(camera.target.x + dx, LIM.x0, LIM.x1);
  camera.target.z = clamp(camera.target.z + dz, LIM.z0, LIM.z1);
}
function pivotPoint(fallback){
  if (S.selected) return new V3(S.selected.x, 0, S.selected.z);
  return fallback || camera.target.clone();
}
function orbitBy(phi, pv){
  pv = pv || pivotPoint();
  const ox = camera.target.x - pv.x, oz = camera.target.z - pv.z, c = Math.cos(phi), sn = Math.sin(phi);
  camera.target.x = pv.x + ox*c - oz*sn; camera.target.z = pv.z + ox*sn + oz*c;
  camera.alpha += phi;
}
function zoomAt(factor, x, y){
  const g1 = (x!=null) ? groundAt(x,y) : null;
  camera.radius = clamp(camera.radius * factor, camera.lowerRadiusLimit, camera.upperRadiusLimit);
  if (g1){ const g2 = groundAt(x,y); if (g2) moveTarget(g1.x-g2.x, g1.z-g2.z); }
}
function twoInfo(){
  const [a,b] = [...ptrs.values()];
  return { dist: Math.hypot(b.x-a.x, b.y-a.y), ang: Math.atan2(b.y-a.y, b.x-a.x), mx:(a.x+b.x)/2, my:(a.y+b.y)/2 };
}
function stopAuto(){ fly = null; S.autoOrbit = false; S.orbitAnim = 0; const b=$('#orbitBtn'); if (b) b.textContent = 'Atrofida aylanish'; }

canvas.addEventListener('pointerdown', e=>{
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  const p = rel(e); ptrs.set(e.pointerId, p);
  stopAuto(); vel.x = vel.z = 0; S.tour = null; S.cinePause = performance.now() + 4000; for (const c of CARS.values()) if (c.drive) c.drive.follow = false;
  if (ptrs.size === 1){
    tapStart = { x:p.x, y:p.y, t:performance.now() };
    const orbit = e.pointerType==='mouse' && (e.button===2 || e.button===1 || e.ctrlKey || e.altKey);
    gest = orbit ? { type:'orbit', x:p.x, y:p.y } : { type:'pan', anchor: groundAt(p.x,p.y), t: performance.now() };
  } else if (ptrs.size === 2){
    tapStart = null;
    const i = twoInfo();
    gest = { type:'multi', prev:i, anchor: groundAt(i.mx, i.my) };
  }
});
canvas.addEventListener('pointermove', e=>{
  if (!ptrs.has(e.pointerId)) return;
  const p = rel(e); ptrs.set(e.pointerId, p);
  if (!gest) return;
  if (gest.type==='pan' && ptrs.size===1){
    const g = groundAt(p.x,p.y);
    if (!gest.anchor){ gest.anchor = g; return; }
    if (g){
      const now = performance.now(), dt = Math.max(1, now-gest.t)/1000;
      let dx = gest.anchor.x-g.x, dz = gest.anchor.z-g.z;

// ---------- render loop ----------
let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsT = 0, autoT = 0, autoChecks = 0, autoLow = 0, autoDown = false;
const fpsHist = [];
scene.onBeforeRenderObservable.add(()=>{

  updateSky();

  else { const mine = myPlots(); let daily = 0; for (const p of mine) if (p.tpl && !p.building) daily += specIncome(p); S.pending += daily * dh/24; }
  if (S.sheet==='mine'){ const el=$('#pend'); if (el) el.textContent = fmt(S.pending); const c=$('#collect'); if(c) c.disabled = S.pending<1; }
  // rising buildings
  for (let i=rising.length-1;i>=0;i--){
    const r = rising[i]; r.t += dt; const k = clamp(r.t/r.dur,0,1); const e = 1-Math.pow(1-k,3);
    if (!r.p.tpl || r.p.inst==null){ rising.splice(i,1); continue; }
    const m = plotMatrix(r.p, Math.max(0.02,e));
    for (const pt of T[r.p.vkey].parts) pt.mesh.thinInstanceSetMatrixAt(r.p.inst, m, true);
    if (k>=1){ rising.splice(i,1); r.p.building=false; if (r.p.state==='mine'){ toast(`${buildingName(r.p)} tayyor! Kuniga +${fmt(specIncome(r.p))} tanga.`); if (API.on) refreshMe(); if (S.tut===3) setTimeout(()=>tut(0),4000); } }

    camera.target.x = lerp(fly.from.x, fly.to.x, e); camera.target.z = lerp(fly.from.z, fly.to.z, e);

    if (fly.to.a!=null) camera.alpha = lerp(fly.from.a, fly.to.a, e);

    camera.alpha += dt*0.045;

  }
  if (S.quality==='auto'){
    autoT += dt;

    }
  }
});

  if (idemKey) headers['idempotency-key'] = idemKey;

  let j = null; try { j = await r.json(); } catch(_){}
  if (!r.ok){ const e = new Error((j && j.message) || 'Xatolik yuz berdi'); e.code = j && j.error; e.status = r.status; e.data = j; throw e; }
  return j;
}

      ${opts.dev ? `<div class="sep">${opts.telegramBot?'yoki ':''}sinov uchun kirish</div><div class="row"><input id="devName" placeholder="Ismingiz (test)" maxlength="40"><button class="btn primary" id="devGo" style="flex:0 0 auto">Kirish</button></div>` : ''}

      <p class="note">Kirish bilan shahar qoidalariga rozilik bildirasiz.</p>
      <button class="h-browse" id="authBack" style="color:var(--muted);font-size:14px;margin-top:6px">← Orqaga</button>`);
    $('#authBack').onclick = () => resolve(false);
    if (opts.telegramBot){
      window.onTelegramAuth = async (user) => { try { await api('POST','/api/auth/telegram', user); resolve(true); } catch(e){ toast(e.message); } };
      const sc = document.createElement('script');
      sc.async = true; sc.src = 'https://telegram.org/js/telegram-widget.js?22';
      sc.setAttribute('data-telegram-login', opts.telegramBot); sc.setAttribute('data-size','large'); sc.setAttribute('data-radius','12');

    if (opts.dev){
      const go = async ()=>{ const n = $('#devName').value.trim(); if (!n) return; try { await api('POST','/api/auth/dev',{ name:n }); resolve(true); } catch(e){ toast(e.message); } };

}
const AVATAR_COLORS = ['#2fb5a3','#3a6ea5','#e08a2c','#c0503b','#7b5ea7','#3f9a5a','#d4a72c','#5a7d9a','#b5577b','#4f8a8b','#8a6f4f','#6b6bd6'];
function showNickname(){
  return new Promise(resolve=>{
    let avatar = 1, t;
    authCard(`<h2>Nikingizni tanlang</h2><p class="lead">Boshqalar sizni shu nom bilan ko‘radi. Haqiqiy ismingiz shart emas.</p>
      <input id="nickIn" placeholder="masalan: shohrux_77" maxlength="20" autocomplete="off"><div id="nickMsg" class="note">&nbsp;</div>
      <div class="lbl2" style="margin:10px 0 6px">Avatar</div><div class="avs">${AVATAR_COLORS.map((c,i)=>`<button class="av ${i===0?'sel':''}" data-i="${i+1}" style="background:${c}">${String.fromCharCode(65+i)}</button>`).join('')}</div>
      <label class="chk"><input type="checkbox" id="age16"> 16 yoshdan kattaman</label>
      <details class="rules"><summary>Shahar qoidalari</summary><ol><li>Hurmat: haqorat va kamsitish yo‘q.</li><li>Reklama va spam yo‘q.</li><li>Firibgarlik yo‘q.</li><li>Birovdan shaxsiy ma’lumot so‘ramang.</li><li>Nomaqbul nik va nomlar o‘chiriladi.</li></ol></details>
      <button class="btn primary" id="nickGo" style="width:100%;margin-top:12px" disabled>Shaharga kirish</button>`);
    const inp = $('#nickIn'), msg = $('#nickMsg'), go = $('#nickGo'), age = $('#age16');
    const valid = ()=>{ go.disabled = !(inp.dataset.ok==='1' && age.checked); };
    const sugg = list => list && list.length ? '. Bo‘sh variantlar: ' + list.map(x=>`<a href="#" class="sg">${x}</a>`).join(', ') : '';
    const bindSugg = ()=> msg.querySelectorAll('.sg').forEach(a=>a.onclick=e=>{ e.preventDefault(); inp.value=a.textContent; inp.oninput(); });
    inp.oninput = ()=>{ inp.dataset.ok='0'; valid(); clearTimeout(t); const v = inp.value.trim(); if (v.length<3){ msg.textContent='Kamida 3 belgi'; return; }
      t = setTimeout(async ()=>{ try { const r = await api('GET','/api/nickname/available?n='+encodeURIComponent(v));
        if (r.available){ msg.innerHTML='<span style="color:#7fe0c9">✓ Bo‘sh</span>'; inp.dataset.ok='1'; } else { msg.innerHTML=(r.reason||'Band')+sugg(r.suggestions); bindSugg(); } valid(); } catch(_){} }, 300); };
    age.onchange = valid;
    $('.avs').querySelectorAll('.av').forEach(b=>b.onclick=()=>{ $('.avs').querySelectorAll('.av').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); avatar=+b.dataset.i; });
    go.onclick = async ()=>{ go.disabled = true;
      try { await api('POST','/api/me/nickname',{ nickname: inp.value.trim(), avatarId: avatar, confirm16: true }); resolve(); }
      catch(e){ msg.innerHTML = e.message + sugg(e.data && e.data.suggestions); bindSugg(); go.disabled = false; } };
    setTimeout(()=>inp.focus(), 50);
  });
}
