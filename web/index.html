let LANG = 'uz'; try { const l = localStorage.getItem('mahalla_lang'); if (I18N[l]) LANG = l; } catch(_){}
const tr = k => I18N[LANG][k] || I18N.uz[k] || k;
function applyLang(){
  document.querySelectorAll('#hero [data-i18n]').forEach(el => el.textContent = tr(el.dataset.i18n));
  $('#tgIn').placeholder = tr('ph');
  $('#hLangs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  document.documentElement.lang = LANG;
  renderChips();
}
function renderChips(){
  const lm = ['lm_burj','lm_abraj','lm_shanghai','lm_owtc','lm_merdeka'].map(k => plots.find(p => p.tpl === k)).filter(Boolean);
  const tea = plots.find(p => p.tpl === 'cafe' && p.style === 'milliy');
  const items = lm.map(p => [p, TPL[p.tpl].name.replace(/ \(.*\)$/, '')]);
  if (tea) items.push([tea, tr('choyxona')]);
  $('#hChips').innerHTML = items.map(([p, n]) => `<button data-pid="${p.id}">${esc(n)}</button>`).join('');
  $('#hChips').querySelectorAll('button').forEach(b => b.onclick = () => { const p = plots[+b.dataset.pid]; leaveHero(); visitPlot(p); });
}
function countUp(el, to){
  const from = +(el.dataset.v || 0), t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0)/1400), v = Math.round(from + (to - from)*(1 - Math.pow(1-k, 3))); el.textContent = fmt(v); if (k < 1) requestAnimationFrame(step); else el.dataset.v = to; };
  requestAnimationFrame(step);
}
function setPopulation(n){ countUp($('#popN'), n); countUp($('#popN2'), n); }
function visitPlot(p){ const h = (p.vkey && T[p.vkey] ? T[p.vkey].height : 10); flyTo(p.x, p.z, Math.max(70, h*2.1), h > 40 ? 1.12 : 1.05); showPlot(p); }
function showHero(){
  document.body.classList.add('hero'); $('#hero').classList.add('show');
  introAudio().then(() => playIntro()).catch(() => {});      // load early; plays now if the browser allows it
  S.heroSpeed = S.speed; S.speed = 0; S.hours = 17.6; S.cine = true; S.cinePause = 0;
  closeSheet(); select(null); tut(0); applyLang();
}
// ---------- intro sound: the Susambil voice-over on a calm dutar/nay/doira tune (web/audio/intro.js) ----------
// Plays once on the welcome screen. Browsers allow sound only after a tap, so it starts on the first tap or key
// on the welcome screen (or right away when allowed); the speaker button mutes it, and the choice is remembered.
const INTRO = { el: null, muted: false, started: false };
try { INTRO.muted = localStorage.getItem('susambil_mute') === '1'; } catch(_){}
function introAudio(){
  if (INTRO.el) return Promise.resolve(INTRO.el);
  return new Promise((ok, no) => {
    const go = () => { const a = new Audio(window.SUSAMBIL_INTRO); a.volume = 0.9; a.onplay = () => $('#hSnd').classList.add('playing'); a.onpause = a.onended = () => $('#hSnd').classList.remove('playing'); ok(INTRO.el = a); };
    if (window.SUSAMBIL_INTRO) return go();
    const sc = document.createElement('script'); sc.src = 'audio/intro.js'; sc.onload = go; sc.onerror = no; document.head.appendChild(sc);
  });
}
function playIntro(){
  if (INTRO.muted || INTRO.started || !$('#hero').classList.contains('show')) return;
  introAudio().then(a => a.play().then(() => { INTRO.started = true; }).catch(() => {})).catch(() => {});
}
function fadeIntro(){
  const a = INTRO.el; if (!a || a.paused) return;
  const v0 = a.volume, t0 = performance.now();
  const step = () => { const k = (performance.now() - t0)/1400; if (k >= 1){ a.pause(); a.volume = v0; return; } a.volume = v0*(1 - k); requestAnimationFrame(step); };
  step();
}
$('#hSnd').classList.toggle('off', INTRO.muted);
$('#hSnd').onclick = e => {
  e.stopPropagation();
  if (!INTRO.muted && !INTRO.started){ playIntro(); return; }        // sound was blocked until now: this tap starts it
  INTRO.muted = !INTRO.muted; try { localStorage.setItem('susambil_mute', INTRO.muted ? '1' : '0'); } catch(_){}
  $('#hSnd').classList.toggle('off', INTRO.muted);
  if (INTRO.muted){ if (INTRO.el) INTRO.el.pause(); }
  else introAudio().then(a => { if (a.ended || a.currentTime > a.duration - 0.5) a.currentTime = 0; a.play().then(() => { INTRO.started = true; }).catch(() => {}); });
};
for (const ev of ['pointerdown', 'keydown']) $('#hero').addEventListener(ev, e => { if (!e.target.closest('#hSnd')) playIntro(); }, { capture: true });
function leaveHero(){
  if (!$('#hero').classList.contains('show')) return;
  fadeIntro();
  $('#hero').classList.remove('show'); document.body.classList.remove('hero');
  S.cine = false; S.speed = S.heroSpeed ?? 1; S.hours = 15.8; // play starts in bright afternoon light
}
$('#hLangs').querySelectorAll('button').forEach(b => b.onclick = () => { LANG = b.dataset.l; try { localStorage.setItem('mahalla_lang', LANG); } catch(_){} applyLang(); });
$('#findForm').onsubmit = async e => {
  e.preventDefault();
  const q = $('#tgIn').value.trim().replace(/^@/, ''); if (!q) { $('#tgIn').focus(); return; }
  let ids = [];
  if (API.on){ try { const r = await api('GET', '/api/find?q=' + encodeURIComponent(q)); ids = r.plots || []; } catch(_){} }
  else { const ql = q.toLowerCase(); ids = plots.filter(p => p.owner && p.owner !== 'Shahar hokimligi' && ((p.ownerTg||'').toLowerCase() === ql || p.owner.toLowerCase() === ql)).map(p => p.id); }
  const msg = $('#findMsg');
  if (!ids.length){ msg.textContent = tr('notFound'); msg.classList.add('show'); const g = $('#getBtn'); g.classList.remove('pulse'); void g.offsetWidth; g.classList.add('pulse'); return; }
  msg.classList.remove('show'); leaveHero(); visitPlot(plots[ids[0]]);

$('#tourBtn').onclick = () => {
  const list = plots.filter(p => p.tpl && TPL[p.tpl] && TPL[p.tpl].landmark).sort((a,b) => Math.atan2(a.z,a.x) - Math.atan2(b.z,b.x));

  if (API.on && !(await ensureLogin())) return;

};
$('#browseBtn').onclick = () => { leaveHero(); if (!API.on || (API.me && API.me.nickname)) tut(1); else toast('Ko‘rish rejimi. Yer olish uchun bo‘sh uchastkani bosing.'); };

// sign-in only when it is needed (buying), so visitors can look around freely
async function ensureLogin(){
  if (!API.on) return true;
  if (API.me && API.me.nickname) return true;
  if (!API.me){ const ok = await showLogin(API.opts); if (!ok){ closeAuth(); return false; } await refreshMe(); }
  if (!API.me.nickname){ await showNickname(); await refreshMe(); }
  closeAuth();
  try { applyCity(await api('GET','/api/city')); flushBuffers(); } catch(_){}
  return true;
}

async function boot(){
  let opts = null;
  if (location.protocol.startsWith('http')){
    try {
      const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 3000);
      const r = await fetch('/api/auth/options', { signal: ctl.signal, credentials:'same-origin' }); clearTimeout(to);
      if (r.ok && (r.headers.get('content-type')||'').includes('json')){
        const j = await r.json();
        // only our own server answers with exactly this shape; anything else = no Mahalla server here
        if (j && typeof j.dev === 'boolean' && 'telegramBot' in j) opts = j;
      }
    } catch(_){}
  }
  const offline = () => { // demo mode without a server (e.g. the published artifact)
    API.on = false;
    populateDemo(); setCars([{ owner: { id: -1, nickname: 'shohruh.97', telegram: null }, model: 'tracker', color: '#f2f3f1', plate: { region: '90', text: 'Y095AB', kind: 'standard' } }]); flushBuffers(); updateCoins();
    $('#loader').classList.add('hide');
    showHero(); setPopulation(new Set(plots.filter(p => p.owner && p.owner !== 'Shahar hokimligi').map(p => p.owner)).size);
  };
  if (!opts) return offline();
  API.on = true;
  let city;
  try { city = await api('GET','/api/city'); if (!city || !Array.isArray(city.plots)) throw new Error('bad city'); }
  catch(e){ return offline(); }
  try {
    API.daySeconds = city.economy.daySeconds; S.limit = city.economy.plotLimit;
    seed = 7;
    applyCity(city);
    for (const d of city.plots){ const p = plots[d.id]; if (p && p.zone==='res' && p.tpl && rnd()<0.5) addTree(p.x+3.6*(rnd()<.5?-1:1), p.z+3.6*(rnd()<.5?-1:1), 0.55); }
    flushBuffers();
  } catch(e){ console.error(e); }
  API.opts = opts;
  $('#loader').classList.add('hide');
  connectWs();
  let me = null;
  try { me = await refreshMe(); } catch(_){}
  if (!me || !me.nickname){ showHero(); setPopulation(city.stats ? city.stats.residents : 0); return; }
  closeAuth();
  // re-mark my plots now that we know who "me" is
  applyCity(await api('GET','/api/city'));
  pads.flush();
  if (!me.plots.length) setTimeout(()=>tut(1), 400); else tut(0);
}

// ---------- start ----------
applyQuality(autoStart());
updateCoins(); updateSky();

window.addEventListener('resize', ()=>engine.resize());
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) engine.stopRenderLoop(); else { last = performance.now(); engine.runRenderLoop(()=>scene.render()); } });
