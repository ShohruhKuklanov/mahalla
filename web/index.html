<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mahalla — 3D shahar sinov namunasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: rgba(18,22,30,.78);
    --bg-solid:#141922;
    --line: rgba(255,255,255,.10);
    --ink:#f4f1ea;
    --muted:#a9b0bc;
    --accent:#2fb5a3;
    --accent-ink:#06231f;
    --gold:#f3c14b;
    --danger:#e86a5a;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .glass{background:var(--bg);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line)}

  /* top bar */
  #top{position:fixed;left:10px;right:10px;top:10px;display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
  #top > *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;font-weight:800;letter-spacing:.2px}
  .brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#2fb5a3,#3a6ea5);display:inline-block;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
  .chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
  .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a3,#e0a520 70%);box-shadow:0 0 0 2px rgba(0,0,0,.2) inset}
  .spacer{flex:1}
  #fps{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);font-weight:600}
  #fps b{color:var(--ink)}
  @media (max-width:520px){ .brand span{display:none} .brand{padding:8px} #clockChip .lbl{display:none} }

  /* legend */
  #legend{position:fixed;left:10px;top:62px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px);pointer-events:none}
  #legend .chip{font-size:12px;padding:5px 10px;font-weight:600;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* side tools */
  #tools{position:fixed;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:5}
  .tool{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:13px}
  .tool svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tool:active{transform:scale(.94)}

  /* bottom nav */
  #nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:flex;gap:4px;padding:6px;border-radius:22px}
  #nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:16px;font-size:11.5px;font-weight:700;color:var(--muted);min-width:72px}
  #nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #nav button.primary{background:var(--accent);color:var(--accent-ink)}
  #nav button:active{transform:scale(.96)}

  /* sheet */
  #sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(520px,100%);z-index:10;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:78vh;overflow:auto;background:rgba(20,25,34,.94)}
  #sheet.open{transform:translate(-50%,0)}
  #sheet .grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.22);margin:2px auto 12px}
  #sheet h3{margin:0 0 2px;font-size:20px;font-weight:800}
  #sheet .sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .kv div{background:rgba(255,255,255,.05);border-radius:12px;padding:9px 11px}
  .kv small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
  .kv b{font-size:15px}
  .row{display:flex;gap:8px}
  .btn{flex:1;padding:14px 16px;border-radius:14px;font-weight:800;font-size:15px;background:rgba(255,255,255,.08);min-height:48px}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.gold{background:var(--gold);color:#2b1d00}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:active:not(:disabled){transform:scale(.98)}
  .note{font-size:12.5px;color:var(--muted);margin-top:10px}
  .note.warn{color:#f6b2a8}
  .x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.07);font-size:18px}

  .tpls{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scroll-snap-type:x mandatory}
  .tpl{flex:0 0 132px;scroll-snap-align:start;border-radius:14px;background:rgba(255,255,255,.05);padding:10px;text-align:left;border:2px solid transparent}
  .tpl.sel{border-color:var(--accent);background:rgba(47,181,163,.12)}
  .tpl .ic{height:62px;border-radius:10px;margin-bottom:8px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
  .tpl .ic svg{width:56px;height:56px}
  .tpl b{display:block;font-size:13.5px}
  .tpl small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}
  .tpl:disabled{opacity:.45}
  .swatches{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
  .sw.sel{border-color:var(--ink)}
  .lbl2{font-size:12px;color:var(--muted);font-weight:700;margin:0 4px 0 0;text-transform:uppercase;letter-spacing:.6px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chipb{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.07);font-weight:700;font-size:13px;color:var(--muted)}
  .chipb.on{background:var(--ink);color:#141922}
  .tpl small+small{margin-top:0}
  .seg{display:flex;background:rgba(255,255,255,.06);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
  .seg button{flex:1;padding:10px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
  .seg button.on{background:var(--ink);color:#141922}
  input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 14px}

  .list .item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:8px}
  .list .item div{flex:1}
  .list .item small{color:var(--muted);display:block;font-size:12px}
  .list .item button{padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.08);font-weight:700;font-size:13px}

  /* toast */
  #toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;z-index:20;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* tutorial */
  #tut{position:fixed;left:50%;top:112px;transform:translateX(-50%);z-index:6;width:min(420px,calc(100% - 20px));border-radius:16px;padding:12px 14px;display:none;gap:10px;align-items:flex-start}
  #tut.show{display:flex}
  #tut .n{flex:0 0 28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
  #tut p{margin:0;font-size:14px;line-height:1.4;flex:1}
  #tut button{color:var(--muted);font-size:12.5px;font-weight:700;padding:4px}

  /* ---------- welcome screen over the living city ---------- */
  body.hero #labels{opacity:0}
  #labels{transition:opacity .6s}
  body.hero #top, body.hero #legend, body.hero #tools, body.hero #nav, body.hero #tut, body.hero #sheet{display:none}
  #hero{position:fixed;inset:0;z-index:30;display:none;pointer-events:none;color:#fff8ec}
  #hero.show{display:block}
  #hero::before{content:'';position:absolute;inset:0;background:
      radial-gradient(ellipse 70% 55% at 50% 58%, rgba(10,12,30,.62), rgba(10,12,30,.15) 70%, transparent),
      linear-gradient(180deg, rgba(10,12,30,.0) 0%, rgba(10,12,30,.0) 35%, rgba(12,14,34,.55) 80%, rgba(12,14,34,.85) 100%)}
  .h-top{position:absolute;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:auto}
  .h-brand{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:16px;background:rgba(16,18,40,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
           font:800 14px/1 Unbounded,Manrope,sans-serif;letter-spacing:.12em;border:1px solid rgba(255,255,255,.08)}
  .h-brand i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 45deg,#2fb5a3,#3a6ea5,#f6c453,#2fb5a3);animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .h-pop{padding:10px 18px;border-radius:16px;background:rgba(16,18,40,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:center;border:1px solid rgba(255,255,255,.08)}
  .h-pop small{display:block;color:#f6c453;font:800 11px/1 Unbounded,sans-serif;letter-spacing:.14em;margin-bottom:4px}
  .h-pop b{font:800 26px/1 Unbounded,sans-serif;font-variant-numeric:tabular-nums}
  .h-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);width:min(640px,calc(100% - 32px));text-align:center;pointer-events:auto}
  .h-langs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
  .h-langs button{padding:9px 16px;border-radius:999px;background:rgba(30,32,62,.78);font-weight:800;font-size:14px;color:#e9e5ff;border:1px solid rgba(255,255,255,.08)}
  .h-langs button.on{background:#f6c453;color:#2a1d00}
  .h-badge{display:inline-block;padding:8px 16px;border-radius:12px;background:#f6c453;color:#2a1d00;font:800 14px/1.1 Manrope,sans-serif;box-shadow:0 0 0 0 rgba(246,196,83,.6);animation:pulse 2.8s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(246,196,83,.55)}70%{box-shadow:0 0 0 18px rgba(246,196,83,0)}100%{box-shadow:0 0 0 0 rgba(246,196,83,0)}}
  #hero h1{margin:16px 0 12px;font:800 clamp(34px,6.4vw,64px)/1.04 Unbounded,Manrope,sans-serif;letter-spacing:-.01em;
           background:linear-gradient(180deg,#fffaf0 30%,#ffd98a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 6px 40px rgba(0,0,0,.25)}
  #hero p.h-sub{margin:0 auto 22px;max-width:560px;font-size:clamp(15px,2.1vw,18px);line-height:1.5;color:#e8e4f6;font-weight:600}
  .h-in{display:flex;align-items:center;height:62px;border-radius:18px;background:rgba(14,16,36,.82);border:2px solid #f6c453;box-shadow:0 0 34px rgba(246,196,83,.25);padding:0 18px;margin-bottom:12px}
  .h-in span{color:#2AABEE;font:800 22px/1 Manrope,sans-serif;margin-right:6px}
  .h-in input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;color:#fff;font:700 19px Manrope,sans-serif;text-align:center}
  .h-in input::placeholder{color:#8f8db2}
  .h-in svg{flex:0 0 26px}
  .h-btn{width:100%;height:62px;border-radius:18px;background:#f6c453;color:#22180a;font:800 20px/1 Manrope,sans-serif;box-shadow:0 10px 30px rgba(246,196,83,.25);transition:transform .15s}
  .h-btn:active{transform:scale(.98)}
  #findMsg{min-height:0;max-height:0;overflow:hidden;transition:.25s;color:#ffd1c4;font-weight:700;font-size:14px;margin-top:0}
  #findMsg.show{max-height:80px;margin-top:10px}
  .h-cta{display:inline-flex;margin-top:16px;padding:12px 22px;border-radius:999px;font:800 17px/1 Manrope,sans-serif;color:#ffd98a;
         background:linear-gradient(90deg,#5b2a86,#a23b72,#5b2a86);background-size:200% 100%;animation:shine 6s linear infinite;border:1.5px solid rgba(255,217,138,.45)}
  @keyframes shine{to{background-position:200% 0}}
  .h-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .h-chips button{padding:9px 14px;border-radius:999px;background:rgba(20,22,46,.8);font-weight:800;font-size:13.5px;color:#f1efff;border:1.5px solid rgba(255,255,255,.08)}
  .h-chips button:nth-child(1){border-color:#5fd4f0;color:#bff1ff}
  .h-chips button:nth-child(2){border-color:#f08ab4;color:#ffd0e3}
  .h-row{display:flex;gap:18px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
  .h-get{padding:11px 20px;border-radius:14px;background:rgba(47,181,163,.95);color:#06231f;font-weight:800;font-size:15px}
  .h-get.pulse{animation:pulse2 1.2s ease-in-out 3}
  @keyframes pulse2{50%{transform:scale(1.07)}}
  .h-browse{color:#fff;font-weight:800;font-size:15.5px;text-decoration:underline;text-underline-offset:4px;background:none}
  .h-foot{margin-top:14px;color:#cfcbe6;font-weight:700;font-size:14px}
  .h-foot b{color:#f6c453}
  .h-mid > *{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .h-mid > *:nth-child(2){animation-delay:.06s} .h-mid > *:nth-child(3){animation-delay:.12s} .h-mid > *:nth-child(4){animation-delay:.18s}
  .h-mid > *:nth-child(5){animation-delay:.24s} .h-mid > *:nth-child(6){animation-delay:.3s} .h-mid > *:nth-child(7){animation-delay:.36s}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .h-mid > *, .h-badge, .h-cta, .h-brand i{animation:none} }
  @media (max-width:560px){ .h-mid{top:auto;bottom:18px;transform:translateX(-50%)} .h-pop b{font-size:20px} .h-brand{font-size:12px} .h-in,.h-btn{height:56px} .h-chips button:nth-child(n+5){display:none} }
  @media (max-height:700px) and (min-width:561px){ .h-mid{transform:translate(-50%,-50%) scale(.88)} }

  /* owner labels over buildings */
  #labels{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  .olbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;background:rgba(14,18,26,.80);
        border:1.5px solid rgba(255,255,255,.22);color:#fff;font:700 12px/1 Manrope,system-ui,sans-serif;white-space:nowrap;max-width:230px;will-change:transform}
  .olbl span{overflow:hidden;text-overflow:ellipsis}
  .olbl.tg{border-color:rgba(42,171,238,.85)}
  .olbl.mine{background:rgba(14,64,58,.92);border-color:#2fb5a3}
  .olbl.mine i{width:7px;height:7px;border-radius:50%;background:#2fb5a3;display:inline-block}
  .olbl::after{content:'';position:absolute;left:50%;bottom:-5px;width:8px;height:8px;margin-left:-4px;background:inherit;border-right:inherit;border-bottom:inherit;transform:rotate(45deg);border-radius:0 0 2px 0}
  /* login / nickname */
  #auth{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(8,11,16,.55)}
  .authbox{width:min(420px,100%);border-radius:22px;padding:22px;background:rgba(20,25,34,.94);max-height:92vh;overflow:auto}
  .authbox .logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#2fb5a3,#3a6ea5);margin-bottom:10px}
  .authbox h2{margin:0 0 4px;font-size:22px;font-weight:800}
  .authbox .lead{color:var(--muted);margin:0 0 12px;font-size:14px;line-height:1.45}
  .authbox input:not([type=checkbox]){width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
  .authbox .row input{flex:1}
  .authbox .sep{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px;font-weight:700}
  .avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .av{aspect-ratio:1;border-radius:12px;font-weight:800;color:#fff;border:3px solid transparent}
  .av.sel{border-color:var(--ink)}
  .chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600}
  .chk input{width:20px;height:20px;accent-color:var(--accent)}
  .rules{margin-top:10px;color:var(--muted);font-size:13px}
  .rules ol{margin:6px 0 0;padding-left:20px;line-height:1.5}
  .sg{color:#7fe0c9}

  /* loader */
  #loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#1d2a3a,#0b0e14);transition:opacity .5s}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .box{text-align:center}
  #loader .logo{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;background:linear-gradient(135deg,#2fb5a3,#3a6ea5);animation:b 1.2s ease-in-out infinite}
  @keyframes b{50%{transform:translateY(-8px) rotate(6deg)}}
  #loader p{color:var(--muted);margin:6px 0 0;font-size:14px}
  #err{display:none;max-width:360px;color:#f6b2a8;font-size:14px;margin-top:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="loader"><div class="box"><div class="logo"></div><b style="font-size:22px">Mahalla</b><p id="loadMsg">3D shahar yuklanmoqda…</p><div id="err"></div></div></div>

<div id="top">
  <div class="brand glass"><i></i><span>Mahalla</span></div>
  <div class="chip glass" title="Tanga"><span class="coin"></span><span id="coins">10 000</span></div>
  <div class="chip glass" id="clockChip"><span id="clockIcon">☀</span><span id="clock">16:00</span></div>
  <div class="spacer"></div>
  <div class="chip glass" id="fps">— fps</div>
</div>

<div id="legend">
  <div class="chip glass"><span class="dot" style="background:#6fae4c"></span>Bo‘sh</div>
  <div class="chip glass"><span class="dot" style="background:#f3c14b"></span>Sotuvda</div>
  <div class="chip glass"><span class="dot" style="background:#c9c3b8"></span>Band</div>
  <div class="chip glass"><span class="dot" style="background:#5b9cf2"></span>Sizniki</div>
</div>

<div id="tools">
  <button class="tool glass" id="rotL" title="Chapga aylantirish"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  <button class="tool glass" id="rotR" title="O‘ngga aylantirish"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
  <button class="tool glass" id="tilt" title="Ko‘rinishni almashtirish">3D</button>
  <button class="tool glass" id="home" title="Mening yerim"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
</div>

<div id="nav" class="glass">

<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.34.0/babylon.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ownerHtml = p => p.ownerTg ? `<a href="https://t.me/${esc(p.ownerTg)}" target="_blank" rel="noopener" style="color:#5cc2f2">@${esc(p.ownerTg)}</a> (${esc(p.owner)})` : `<b>${esc(p.owner)}</b>`;
const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ');

if (!window.BABYLON) { $('#loadMsg').textContent=''; const e=$('#err'); e.style.display='block'; e.textContent='3D kutubxona yuklanmadi. Internetni tekshirib, sahifani yangilang.'; return; }
const B = BABYLON, V3 = B.Vector3, C3 = B.Color3, C4 = B.Color4;

// ---------- deterministic random ----------
let seed = 20261105;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const pick = a => a[Math.floor(rnd()*a.length)];
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const smooth = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const lerp = (a,b,t)=>a+(b-a)*t;

// ---------- engine ----------
const canvas = $('#c');
let engine;
try {
  engine = new B.Engine(canvas, true, { stencil:true, antialias:true, powerPreference:'high-performance', adaptToDeviceRatio:false });
} catch(e){ $('#loadMsg').textContent=''; const el=$('#err'); el.style.display='block'; el.textContent='Brauzeringiz WebGL’ni qo‘llab-quvvatlamaydi.'; return; }
const scene = new B.Scene(engine);
scene.skipPointerMovePicking = true;
scene.fogMode = B.Scene.FOGMODE_EXP2;
scene.fogDensity = 0.0009;

// ---------- city layout ----------
const P = 10;            // plot size (m)
const PB = 4;            // plots per block side
const SW = 2.5;          // sidewalk
const RD = 11;           // road width
const BLK = PB*P + 2*SW; // block size
const PITCH = BLK + RD;
const NBX = 10, NBZ = 8;
const W = NBX*PITCH - RD, D = NBZ*PITCH - RD;
const X0 = -W/2, Z0 = -D/2;
const PARK = (bx,bz) => (bx===4||bx===5) && (bz===3||bz===4);
const DISTRICTS = ['Navro‘z mahallasi','Ipak yo‘li mahallasi','Bog‘ishamol mahallasi'];
const ZONES = {
  res:{ name:'Turar-joy', base:4000 },
  com:{ name:'Savdo',     base:6000 },
  cen:{ name:'Markaz',    base:12000 }
};
const blockX = bx => X0 + bx*PITCH, blockZ = bz => Z0 + bz*PITCH;
const parkMin = new V3(blockX(4), 0, blockZ(3)), parkMax = new V3(blockX(5)+BLK, 0, blockZ(4)+BLK);
const parkC = parkMin.add(parkMax).scale(.5);

const NICKS = ['sardor_77','Malika','jasur.dev','Dilnoza','bekzod_uz','Aziza.k','Otabek','Shahzoda','timur99','nodira','Ulug‘bek','Sevara','Javohir','Kamola','rustam_b','Laylo','Akmal','Madina','Sherzod','Zarina','Bobur','Gulnoza','Islom','Feruza'];

// ---------- building catalog (shared with the server: the <script id="catalog"> block) ----------
const CAT = JSON.parse(document.getElementById('catalog').textContent);
const FLOOR_H = CAT.floorHeight;
const TPL = {};
for (const [k,t] of Object.entries(CAT.types)) TPL[k] = { ...t, key:k, kind:k, landmark:false };
for (const [k,l] of Object.entries(CAT.landmarks)) TPL[k] = { ...l, key:k, kind:'landmark', landmark:true, zones:['cen'], floors:[1,1], roofs:['none'] };
const TPL_KEYS = Object.keys(CAT.types), LM_KEYS = Object.keys(CAT.landmarks), STYLE_KEYS = Object.keys(CAT.styles);
const ACCENT_COLORS = CAT.accents;
const specCost   = s => { const t = TPL[s.tpl]; return t.landmark ? t.cost   : t.cost[0]   + t.cost[1]   * ((s.floors||t.floors[0]) - t.floors[0]); };
const specIncome = s => { const t = TPL[s.tpl]; if (!t) return 0; return t.landmark ? t.income : t.income[0] + t.income[1] * (Math.max(s.floors||0, t.floors[0]) - t.floors[0]); };
const specBuildS = s => { const t = TPL[s.tpl]; return t.landmark ? t.build  : t.build[0]  + t.build[1]  * ((s.floors||t.floors[0]) - t.floors[0]); };
const minCost = k => specCost({ tpl:k, floors: TPL[k].floors[0] });
const lmHeight = k => Math.round(CAT.landmarks[k].realHeight * CAT.landmarkScale);
function buildingName(p){
  const t = TPL[p.tpl]; if (!t) return 'Bino';
  if (t.landmark) return `${t.name} nusxasi`;
  return `${t.name} · ${p.floors||t.floors[0]} qavat`;
}
function buildingSub(p){
  const t = TPL[p.tpl]; if (!t) return '';
  if (t.landmark) return `${t.city} · asli ${t.realHeight} m, o‘yinda ${lmHeight(p.tpl)} m`;
  return `${CAT.styles[p.style||'modern'].name} uslub · ${CAT.roofs[p.roof] || ''} tom`;
}
const hex = h => C3.FromHexString(h);

// ---------- textures ----------
function facadeTex(name, o){
  const w = 256, h = o.tall ? 512 : 256;
  const dif = new B.DynamicTexture(name+'_d', {width:w, height:h}, scene, true);
  const emi = new B.DynamicTexture(name+'_e', {width:w, height:h}, scene, true);
  const a = dif.getContext(), b = emi.getContext();
  a.fillStyle = o.wall || '#ffffff'; a.fillRect(0,0,w,h);
  // subtle plaster noise
  for (let i=0;i<1400;i++){ const g = 225 + Math.floor(rnd()*30); a.fillStyle=`rgba(${g},${g},${g},.18)`; a.fillRect(rnd()*w, rnd()*h, 2, 2); }
  b.fillStyle = '#000'; b.fillRect(0,0,w,h);
  const rows=o.rows, cols=o.cols, cw=w/cols, rh=h/rows;
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
    let x=c*cw+cw*o.mx, y=r*rh+rh*o.my, ww=cw*(1-2*o.mx), hh=rh*(1-2*o.my);
    const ground = (r===rows-1) && o.shopFront;
    if (ground){ x=c*cw+cw*0.06; ww=cw*0.88; y=r*rh+rh*0.12; hh=rh*0.82; }
    if (o.curtain){
      a.fillStyle = '#b8c4cf'; a.fillRect(c*cw, r*rh, cw, rh);
      const grad = a.createLinearGradient(0, r*rh, 0, (r+1)*rh);
      grad.addColorStop(0,'#6f8ca6'); grad.addColorStop(1,'#3f5a73');
      a.fillStyle = grad; a.fillRect(c*cw+2, r*rh+3, cw-4, rh-6);
      a.fillStyle='rgba(255,255,255,.10)'; a.fillRect(c*cw+2, r*rh+3, cw*0.35, rh-6);
    } else {
      a.fillStyle = o.frame || '#6b5d4f'; a.fillRect(x-3,y-3,ww+6,hh+6);
      const grad = a.createLinearGradient(0,y,0,y+hh);
      grad.addColorStop(0, ground ? '#4a6378' : '#40566b'); grad.addColorStop(1, ground ? '#22313f' : '#1f2c39');
      a.fillStyle = grad; a.fillRect(x,y,ww,hh);
      a.fillStyle='rgba(255,255,255,.12)'; a.fillRect(x,y,ww*0.3,hh);
      if (!ground && hh>40){ a.fillStyle=o.frame||'#6b5d4f'; a.fillRect(x+ww/2-1.5,y,3,hh); }
      if (o.sill){ a.fillStyle='rgba(0,0,0,.18)'; a.fillRect(x-4,y+hh+3,ww+8,4); }
    }
    const lit = rnd() < (ground ? 0.95 : 0.62);
    if (lit){
      const warm = rnd() < 0.8;
      b.fillStyle = warm ? (ground ? '#ffd48a' : '#ffc66b') : '#cfe3ff';
      if (o.curtain) b.fillRect(c*cw+3, r*rh+4, cw-6, rh-8); else b.fillRect(x,y,ww,hh);
    }
  }
  if (o.cornice){ a.fillStyle='rgba(0,0,0,.22)'; a.fillRect(0,0,w,6); }
  dif.update(true); emi.update(true);
  dif.anisotropicFilteringLevel = 4; emi.anisotropicFilteringLevel = 4;
  return {dif, emi};
}

function noiseTex(name, base, spread, size, speckle){
  const t = new B.DynamicTexture(name, {width:size, height:size}, scene, true);
  const c = t.getContext();
  c.fillStyle = base; c.fillRect(0,0,size,size);
  for (let i=0;i<size*size/6;i++){
    const v = (rnd()-0.5)*spread;
    c.fillStyle = v>0 ? `rgba(255,255,255,${v})` : `rgba(0,0,0,${-v})`;
    c.fillRect(rnd()*size, rnd()*size, speckle, speckle);
  }
  t.update(true); t.wrapU = t.wrapV = B.Texture.WRAP_ADDRESSMODE;
  return t;
}

// ---------- materials ----------
const mats = {};
function stdMat(name, opts){
  const m = new B.StandardMaterial(name, scene);
  m.diffuseColor = opts.diffuse || new C3(1,1,1);
  m.specularColor = opts.spec || new C3(.06,.06,.06);
  m.specularPower = opts.power || 32;
  if (opts.dt) m.diffuseTexture = opts.dt;
  if (opts.et) { m.emissiveTexture = opts.et; m.emissiveColor = new C3(0,0,0); }
  if (opts.emissive) m.emissiveColor = opts.emissive;
  return m;
}
const nightMats = []; // materials whose emissive follows the night

// ---------- light + camera ----------
const camera = new B.ArcRotateCamera('cam', -Math.PI/2.6, 1.08, 300, new V3(0,0,0), scene);
camera.lowerRadiusLimit = 22; camera.upperRadiusLimit = 620;
camera.lowerBetaLimit = 0.18; camera.upperBetaLimit = 1.42;
camera.minZ = 1; camera.maxZ = 4000;
camera.inputs.clear(); // own map-style controls below (pan anywhere, orbit around the selected plot)
canvas.addEventListener('contextmenu', e=>e.preventDefault());

const hemi = new B.HemisphericLight('hemi', new V3(0.2,1,0.1), scene);
hemi.groundColor = new C3(.22,.2,.18);
const sun = new B.DirectionalLight('sun', new V3(-1,-2,-1), scene);
sun.position = new V3(200,300,200);
sun.shadowMinZ = 1; sun.shadowMaxZ = 1600;

// ---------- ground, roads, blocks ----------
const grassTex = noiseTex('grass','#4f7a3a',0.22,256,3); grassTex.uScale = grassTex.vScale = 60;
// the city stands on a grassy island in a lake, mountains all around
const ISLAND_R = 430;
const ground = B.MeshBuilder.CreateCylinder('ground',{diameter:ISLAND_R*2, height:2, tessellation:96},scene);
ground.position.y = -1;
mats.grass = stdMat('grass',{dt:grassTex}); ground.material = mats.grass; ground.isPickable=false; ground.receiveShadows = true;
const lakeTex = noiseTex('lake','#7f8c95',0.35,256,2); lakeTex.uScale = lakeTex.vScale = 60;
const lake = B.MeshBuilder.CreateGround('lake',{width:7000,height:7000},scene);
lake.position.y = -0.55; lake.isPickable = false;
mats.lake = stdMat('lakeM',{dt:lakeTex, diffuse:hex('#1d3b52'), spec:new C3(1,1,1), power:180}); lake.material = mats.lake;

function box(w,h,d,x,y,z){ const m=B.MeshBuilder.CreateBox('b',{width:w,height:h,depth:d,wrap:true},scene); m.position.set(x,y,z); return m; }
function gable(w,h,d,y){ // triangular prism along x

// One facade tile = 4 floors × 2 window bays (4.4 m). Repeated on the walls by faceUV, so any floor count fits.
const TILE_W = 4.4;
function facadeTile(style, group, litP = 0.62){
  const w = 256, h = 512, rows = 4, cols = 2, cw = w/cols, rh = h/rows;
  const dif = new B.DynamicTexture(`ft_${style}_${group}_d`, {width:w, height:h}, scene, true);
  const emi = new B.DynamicTexture(`ft_${style}_${group}_e`, {width:w, height:h}, scene, true);
  const a = dif.getContext(), e = emi.getContext();
  a.fillStyle = '#ffffff'; a.fillRect(0,0,w,h);
  for (let i=0;i<900;i++){ const g = 225 + Math.floor(rnd()*30); a.fillStyle=`rgba(${g},${g},${g},.18)`; a.fillRect(rnd()*w, rnd()*h, 2, 2); }
  e.fillStyle = '#000'; e.fillRect(0,0,w,h);
  const glass = (x,y,ww,hh) => { const g = a.createLinearGradient(0,y,0,y+hh); g.addColorStop(0,'#4a6782'); g.addColorStop(1,'#1f2d3b'); a.fillStyle = g; a.fillRect(x,y,ww,hh); a.fillStyle='rgba(255,255,255,.13)'; a.fillRect(x,y,ww*0.3,hh); };
  const lit = (path) => { if (rnd() < litP){ e.fillStyle = rnd()<0.8 ? '#ffc66b' : '#cfe3ff'; path(); } };
  const big = group === 'shop';
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
    const x0 = c*cw, y0 = r*rh;
    if (style === 'hitech'){
      // curtain wall: full-height glass with slim mullions, a spandrel band per floor
      a.fillStyle = '#e6eaee'; a.fillRect(x0, y0, cw, rh);
      const g = a.createLinearGradient(0,y0,0,y0+rh); g.addColorStop(0,'#8fb0c8'); g.addColorStop(1,'#46637d'); a.fillStyle = g; a.fillRect(x0+3, y0+4, cw-6, rh-16);
      a.fillStyle='rgba(255,255,255,.18)'; a.fillRect(x0+3, y0+4, (cw-6)*0.35, rh-16);
      a.fillStyle='#d5dbe1'; a.fillRect(x0+cw/2-2, y0+4, 4, rh-16);
      lit(()=>{ e.fillRect(x0+4, y0+6, cw-8, rh-20); });
    } else if (style === 'milliy'){
      // arched windows (or arched shop openings) with carved-wood frames
      const ww = big ? cw*0.78 : cw*0.46, hh = big ? rh*0.72 : rh*0.56, x = x0+(cw-ww)/2, y = y0 + rh*0.24, rad = ww/2;
      a.fillStyle = '#6b4a2e'; a.beginPath(); a.moveTo(x-5, y+hh+4); a.lineTo(x-5, y+rad); a.arc(x+rad, y+rad, rad+5, Math.PI, 0); a.lineTo(x+ww+5, y+hh+4); a.closePath(); a.fill();
      const g = a.createLinearGradient(0,y,0,y+hh); g.addColorStop(0,'#4a6782'); g.addColorStop(1,'#1f2d3b'); a.fillStyle = g;
      a.beginPath(); a.moveTo(x, y+hh); a.lineTo(x, y+rad); a.arc(x+rad, y+rad, rad, Math.PI, 0); a.lineTo(x+ww, y+hh); a.closePath(); a.fill();
      a.strokeStyle='#6b4a2e'; a.lineWidth=3; a.beginPath(); a.moveTo(x+rad, y+4); a.lineTo(x+rad, y+hh); a.moveTo(x, y+hh*0.62); a.lineTo(x+ww, y+hh*0.62); a.stroke();
      a.fillStyle='rgba(0,0,0,.14)'; a.fillRect(x0, y0+rh-6, cw, 6);
      lit(()=>{ e.beginPath(); e.moveTo(x, y+hh); e.lineTo(x, y+rad); e.arc(x+rad, y+rad, rad, Math.PI, 0); e.lineTo(x+ww, y+hh); e.closePath(); e.fill(); });
    } else {
      // modern: wide windows, a white slab line per floor
      const ww = big ? cw*0.86 : cw*0.62, hh = big ? rh*0.7 : rh*0.5, x = x0+(cw-ww)/2, y = y0 + rh*(big?0.15:0.25);
      a.fillStyle = '#3c3f44'; a.fillRect(x-3,y-3,ww+6,hh+6); glass(x,y,ww,hh);
      a.fillStyle='rgba(0,0,0,.10)'; a.fillRect(x0, y0+rh-8, cw, 8); a.fillStyle='rgba(255,255,255,.6)'; a.fillRect(x0, y0+rh-10, cw, 3);
      lit(()=>{ e.fillRect(x,y,ww,hh); });
    }
  }
  dif.update(true); emi.update(true);
  for (const t of [dif, emi]){ t.wrapU = t.wrapV = B.Texture.WRAP_ADDRESSMODE; t.anisotropicFilteringLevel = 4; }
  return { dif, emi };
}
const WALLM = {};
function wallMatFor(style, group){
  const k = style + '_' + group; if (WALLM[k]) return WALLM[k];
  const tex = facadeTile(style, group), glassy = style === 'hitech';
  const m = stdMat('w_'+k,{dt:tex.dif, et:tex.emi, spec: glassy ? new C3(.6,.62,.66) : new C3(.08,.08,.08), power: glassy ? 96 : 24});
  nightMats.push(m); return (WALLM[k] = m);
}
const groupOf = tpl => (tpl==='shop'||tpl==='cafe') ? 'shop' : (tpl==='office'||tpl==='tower') ? 'office' : 'home';
// box whose side faces repeat the facade tile: one tile = TILE_W wide, 4 floors high
function wallBox(w, h, d, floors, y0){
  const uw = Math.max(1, Math.round(w/TILE_W)), ud = Math.max(1, Math.round(d/TILE_W)), v = floors/4, V4 = B.Vector4, z = new V4(0,0,0.01,0.01);
  const m = B.MeshBuilder.CreateBox('wb',{width:w, height:h, depth:d, wrap:true, faceUV:[new V4(0,0,uw,v), new V4(0,0,uw,v), new V4(0,0,ud,v), new V4(0,0,ud,v), z, z]}, scene);
  m.position.y = y0 + h/2; return m;
}
function cyl(o, y){ const m = B.MeshBuilder.CreateCylinder('c', o, scene); m.position.y = y; return m; }

// roofs sit on top of the walls (y0 = wall top); each returns [mesh, material, colorKey] parts + extra height
function roofParts(kind, w, d, y0, style){
  const P = [], add = (list, mat, ck=null) => P.push([merge(list), mat, ck]);
  const parapet = () => [box(w+0.3,0.5,0.3,0,y0+0.25,-d/2), box(w+0.3,0.5,0.3,0,y0+0.25,d/2), box(0.3,0.5,d,-w/2,y0+0.25,0), box(0.3,0.5,d,w/2,y0+0.25,0), box(w,0.15,d,0,y0+0.07,0)];
  const tile = style==='hitech' ? roofSlate : roofTile;
  let extra = 0.5;
  if (kind==='gable'){ add([gable(w+0.8, 2.4, d+0.8, y0)], tile); extra = 2.4; }
  else if (kind==='hip'){ add([hip(w+0.8, 2.6, d+0.8, y0)], tile); extra = 2.6; }
  else if (kind==='dome'){
    const r = Math.min(w,d)*0.32;
    add([...parapet(), cyl({diameter:r*2.1, height:1.2, tessellation:24}, y0+0.6)], concrete);
    const dm = B.MeshBuilder.CreateSphere('dm',{diameter:r*2, segments:20, slice:0.5}, scene); dm.position.y = y0+1.2;
    add([dm], domeM, 'accent');
    add([cyl({diameter:0.18, height:1.6, tessellation:6}, y0+1.2+r+0.6), (()=>{ const b2=B.MeshBuilder.CreateSphere('fb',{diameter:0.45,segments:6},scene); b2.position.y=y0+1.2+r+0.3; return b2; })()], goldM);
    extra = 1.2 + r + 1.4;
  } else if (kind==='garden'){
    add(parapet(), concrete);
    add([box(w-0.8,0.4,d-0.8,0,y0+0.35,0)], greenRoofM);
    const bushes = []; for (const [bx,bz] of [[-w*0.25,-d*0.2],[w*0.22,d*0.18],[w*0.05,-d*0.25]]){ const b2 = B.MeshBuilder.CreateSphere('bu',{diameter:1.6,segments:8},scene); b2.position.set(bx, y0+1.2, bz); bushes.push(b2); }
    add(bushes, greenRoofM); extra = 2.0;
  } else if (kind==='antenna'){
    add([...parapet(), box(2.2,1.6,2.2,w*0.18,y0+0.8,-d*0.15)], concrete);
    add([cyl({diameter:0.3, height:9, tessellation:6}, y0+4.5), cyl({diameter:0.12, height:5, tessellation:6}, y0+9+2.5)], steelM);
    const l = B.MeshBuilder.CreateSphere('rl',{diameter:0.5,segments:6},scene); l.position.y = y0+14.1; add([l], redLightM);
    extra = 14.3;
  } else if (kind==='helipad'){
    add([...parapet()], concrete);
    const hp = cyl({diameter:Math.min(w,d)*0.86, height:0.25, tessellation:32}, y0+0.6); add([hp], helipadM);
    extra = 1.0;
  } else if (kind==='spire'){
    add([box(w*0.75,2.2,d*0.75,0,y0+1.1,0), box(w*0.5,2.0,d*0.5,0,y0+3.2,0)], steelM);
    add([cyl({diameterTop:0.05, diameterBottom:1.4, height:12, tessellation:8}, y0+4.2+6)], steelM);
    extra = 16.2;
  } else { add([...parapet(), box(1.8,1.2,1.8,-w*0.2,y0+0.6,d*0.15)], concrete); extra = 1.2; }
  return { P, extra };
}

// ---- landmark copies of the world's 10 tallest buildings (stylised, ~1:6.7 scale) ----
function ring(r, sides, round, rot, y, n){
  const out = [], seg = 2*Math.PI/sides;
  for (let i=0;i<n;i++){
    const a = rot + i/n*2*Math.PI, local = ((a - rot) % seg + seg) % seg - seg/2;
    const rp = r*Math.cos(Math.PI/sides)/Math.cos(local), rr = lerp(rp, r*0.94, round);
    out.push(new V3(Math.cos(a)*rr, y, Math.sin(a)*rr));
  }
  return out;
}
function shaft(levels, sides, round, n=48){
  return B.MeshBuilder.CreateRibbon('lm', { pathArray: levels.map(L => ring(L.r, sides, round, L.rot||0, L.y, n)), closePath:true, sideOrientation: B.Mesh.DOUBLESIDE }, scene);
}
const steps = (H, tiers) => { const L = []; let prev = 0; for (const [t, r] of tiers){ L.push({ y: prev*H, r }, { y: t*H, r }); prev = t; } return L; };
const LMMAT = {};
function lmGlass(key, tint, uRep, vRep){
  if (LMMAT[key]) return LMMAT[key];
  const base = facadeTile('hitech', 'office', 0.32);
  const d = base.dif, e = base.emi; d.uScale = e.uScale = uRep; d.vScale = e.vScale = vRep;
  const m = stdMat('lm_'+key,{dt:d, et:e, diffuse:hex(tint), spec:new C3(.7,.72,.78), power:110}); m.diffuseColor = hex(tint);
  nightMats.push(m); return (LMMAT[key] = m);
}
function landmarkParts(key){
  const H = lmHeight(key), P = [], add = (m, mat) => P.push([m, mat, null]);
  const gl = (tint, r) => lmGlass(key, tint, Math.max(4, Math.round(2*Math.PI*r/TILE_W*1.6)), H/(4*FLOOR_H)*1.6);
  if (key==='lm_burj'){
    const lv = steps(H, [[.18,4.8],[.33,4.3],[.46,3.7],[.58,3.1],[.68,2.5],[.76,1.9],[.80,1.4]]).map(L=>({...L, rot:Math.PI/2}));
    add(shaft(lv, 3, 0.5), gl('#cbd7e1', 4));
    add(cyl({diameterTop:0.1, diameterBottom:1.8, height:H*0.2, tessellation:12}, H*0.9), steelM);
  } else if (key==='lm_merdeka'){
    const lv = []; for (let i=0;i<=10;i++){ const t = i/10*0.74; lv.push({ y:t*H, r: lerp(4.6, 3.3, i/10), rot: i%2 ? Math.PI/8 : 0 }); }
    lv.push({ y:0.79*H, r:1.0, rot:0 });
    add(shaft(lv, 8, 0, 16), gl('#a9bccd', 4));
    add(cyl({diameterTop:0.08, diameterBottom:1.4, height:H*0.21, tessellation:8}, H*0.895), steelM);
  } else if (key==='lm_shanghai'){
    const lv = []; for (let i=0;i<=24;i++){ const t = i/24; lv.push({ y: t*0.97*H, r: lerp(4.8, 3.0, t), rot: t*2.09 }); }
    add(shaft(lv, 3, 0.6), gl('#a9d3d1', 4));
    const cap = cyl({diameter:5.4, height:1.2, tessellation:24}, 0.97*H+0.6); add(cap, steelM);
  } else if (key==='lm_abraj'){
    const ped = box(9.6, 9, 9.6, 0, 4.5, 0), tw = box(6.6, H*0.6-9, 6.6, 0, 9 + (H*0.6-9)/2, 0);
    add(merge([ped, tw]), wallMatFor('milliy','office'));
    add(box(7.4, H*0.09, 7.4, 0, H*0.645, 0), stdMat('abrajClockBody',{diffuse:hex('#e9e4d8')}));

// ---- variants: one set of thin-instanced meshes per (type, style, floors, roof) or per landmark ----
const T = {};
const vkey = s => TPL[s.tpl] && TPL[s.tpl].landmark ? s.tpl : `${s.tpl}|${s.style}|${s.floors}|${s.roof}`;
function getVariant(s){
  const key = vkey(s); if (T[key]) return T[key];
  const t = TPL[s.tpl], parts = [];
  const add = (mesh, mat, colorKey) => { mesh.material = mat; mesh.isPickable = true; parts.push({ mesh, colorKey }); };
  let height;
  if (t.landmark){
    const L = landmarkParts(s.tpl); for (const [m, mat, ck] of L.P) add(m, mat, ck); height = L.height;
  } else {
    const style = s.style || 'modern', floors = s.floors || t.floors[0], w = t.w, d = t.d;
    const wallH = floors*FLOOR_H + (groupOf(s.tpl)==='shop' ? 0.6 : 0);
    add(wallBox(w, wallH, d, floors, 0), wallMatFor(style, groupOf(s.tpl)), 'wall');
    const accents = [], steel = [], orn = [];
    if (style === 'milliy'){
      orn.push(box(w+0.25, 0.9, d+0.25, 0, wallH-0.45, 0));                         // ornament band under the cornice
      orn.push(box(Math.min(3.4, w*0.45), Math.min(4.6, wallH*0.9), 0.5, 0, Math.min(4.6, wallH*0.9)/2, d/2+0.2)); // iwan portal
    } else if (style === 'hitech'){
      for (const [x,z] of [[-w/2,-d/2],[w/2,-d/2],[-w/2,d/2],[w/2,d/2]]) steel.push(box(0.35, wallH+0.6, 0.35, x, (wallH+0.6)/2, z));
      steel.push(box(w+0.2, 0.35, d+0.2, 0, wallH+0.1, 0));
    } else {
      steel.push(box(w+0.4, 0.3, d+0.4, 0, wallH, 0));
      if (s.tpl==='flat' || s.tpl==='office') for (let f=1; f<floors; f++) steel.push(box(w*0.7, 0.18, 0.9, 0, f*FLOOR_H, d/2+0.45)); // balconies
    }
    if (s.tpl==='shop' || s.tpl==='cafe'){ const aw = box(w*0.9, 0.16, 1.6, 0, 3.0, d/2+0.75); aw.rotation.x = -0.26; accents.push(aw); }
    if (orn.length) add(merge(orn), ornamentM, 'accent');
    if (steel.length) add(merge(steel), style==='hitech' ? steelM : concrete, null);
    if (accents.length) add(merge(accents), accentM, 'accent');
    const R = roofParts(s.roof || t.roofs[0], w, d, wallH + (style==='hitech'?0.25:0), style);
    for (const [m, mat, ck] of R.P) add(m, mat, ck);
    height = wallH + R.extra;
  }
  for (const pt of parts){
    pt.mesh.receiveShadows = true;
    if (pt.colorKey) pt.mesh.thinInstanceRegisterAttribute('color', 4);
    pt.mesh.thinInstanceEnablePicking = true;
    pt.mesh.alwaysSelectAsActiveMesh = true;
    pt.mesh.setEnabled(false);
    if (shadowGen) shadowGen.addShadowCaster(pt.mesh, false);
  }
  return (T[key] = { key, parts, plotsByInst: [], height });
}

  float hash(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164))) * 43758.5453); }

const cars = [];

(function spawnCars(){
  for (let i=0;i<CAR_N;i++){
    const alongX = rnd() < 0.5, dir = rnd() < 0.5 ? 1 : -1;
    const line = alongX ? Z0 - RD/2 + Math.floor(rnd()*(NBZ+1))*PITCH : X0 - RD/2 + Math.floor(rnd()*(NBX+1))*PITCH;
    const len = alongX ? W + 2*RD : D + 2*RD, start = alongX ? X0 - RD : Z0 - RD;
    cars.push({ alongX, dir, line: line + dir*2.6*(alongX ? 1 : -1), start, len, pos: rnd()*len, speed: lerp(7, 15, rnd()) });
  }
  carMesh.thinInstanceSetBuffer('matrix', carBuf, 16, false);
  head.thinInstanceSetBuffer('matrix', carBuf, 16, false);
  tail.thinInstanceSetBuffer('matrix', carBuf, 16, false);
  carMesh.thinInstanceRegisterAttribute('color', 4);
  cars.forEach((c, i) => { const col = hex(CAR_COLORS[i % CAR_COLORS.length]); carMesh.thinInstanceSetAttributeAt('color', i, [col.r, col.g, col.b, 1], false); });
  carMesh.thinInstanceBufferUpdated('color');
  [carMesh, head, tail].forEach(m => { m.alwaysSelectAsActiveMesh = true; m.receiveShadows = true; });
})();
let carsVisible = CAR_N;
function updateCars(dt){
  for (let i=0;i<CAR_N;i++){
    const c = cars[i], o = i*16;
    c.pos = (c.pos + c.dir*c.speed*dt + c.len) % c.len;
    const along = c.start + c.pos, x = c.alongX ? along : c.line, z = c.alongX ? c.line : along;
    const hide = i >= carsVisible || (x > parkMin.x-2 && x < parkMax.x+2 && z > parkMin.z-2 && z < parkMax.z+2);
    const th = c.alongX ? (c.dir > 0 ? Math.PI/2 : -Math.PI/2) : (c.dir > 0 ? 0 : Math.PI), cs = Math.cos(th), sn = Math.sin(th), k = hide ? 0 : 1;
    carBuf[o]=cs*k; carBuf[o+1]=0; carBuf[o+2]=-sn*k; carBuf[o+3]=0;
    carBuf[o+4]=0; carBuf[o+5]=k; carBuf[o+6]=0; carBuf[o+7]=0;
    carBuf[o+8]=sn*k; carBuf[o+9]=0; carBuf[o+10]=cs*k; carBuf[o+11]=0;
    carBuf[o+12]=x; carBuf[o+13]=0.05; carBuf[o+14]=z; carBuf[o+15]=1;
  }
  carMesh.thinInstanceBufferUpdated('matrix'); head.thinInstanceBufferUpdated('matrix'); tail.thinInstanceBufferUpdated('matrix');
}

function addBuilding(p, refresh){
  const t = getVariant(p); p.vkey = t.key;

    if (!pt.mesh.isEnabled()) pt.mesh.setEnabled(true);

const LBL = { on:true, max:140, px:26 };
const lblLayer = document.createElement('div'); lblLayer.id = 'labels'; document.body.insertBefore(lblLayer, document.getElementById('top'));
const labelY = p => 0.42 + (p.tpl && T[p.vkey] ? T[p.vkey].height : 0) + 2.5;
const TG_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#2AABEE"/><path d="M5.5 11.8l11-4.3c.5-.2 1 .1.8.9l-1.9 8.8c-.1.6-.5.8-1 .5l-2.8-2.1-1.4 1.3c-.2.2-.3.3-.6.3l.2-2.9 5.3-4.8c.2-.2 0-.3-.3-.1l-6.6 4.1-2.8-.9c-.6-.2-.6-.6.1-.8z" fill="#fff"/></svg>';
function setLabel(p){
  let text = p.owner ? (p.ownerTg ? '@' + p.ownerTg : p.owner) : null;
  if (text && p.tpl && TPL[p.tpl] && TPL[p.tpl].landmark){ // landmarks: the building's name first
    const nm = TPL[p.tpl].name.replace(/ \(.*\)$/, '');
    text = p.owner === 'Shahar hokimligi' ? nm : `${nm} · ${text}`;
  }
  if (!text){ p.lbl = null; return; }
  const kind = p.state==='mine' ? 'mine' : p.ownerTg ? 'tg' : 'nick';
  p.lbl = { text, kind, pos: new V3(p.x, labelY(p), p.z), key: kind + '|' + text };
}
const lblPool = [];
function lblEl(i){
  while (lblPool.length <= i){ const d = document.createElement('div'); d.className = 'olbl'; d.style.display = 'none'; lblLayer.appendChild(d); lblPool.push(d); }
  return lblPool[i];
}
let lblTimer = 0, lblShown = [];
const _proj = new V3();
function projectLbl(p){
  const k = engine.getHardwareScalingLevel(), vp = camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight());
  V3.ProjectToRef(p.lbl.pos, B.Matrix.IdentityReadOnly, scene.getTransformMatrix(), vp, _proj);
  return { x: _proj.x*k, y: _proj.y*k, z: _proj.z };
}
function updateLabels(dt){
  lblTimer -= dt;
  if (lblTimer <= 0){
    lblTimer = 0.25;
    lblShown = [];
    if (LBL.on){
      const camPos = camera.position, all = [];
      for (const p of plots) if (p.lbl){ p._ld = V3.Distance(camPos, p.lbl.pos); all.push(p); }
      const prio = p => (p === S.selected) * 2 + (p.state === 'mine');
      all.sort((a,b) => prio(b) - prio(a) || a._ld - b._ld);
      const taken = [], W = canvas.clientWidth, H = canvas.clientHeight;
      for (const p of all){
        if (lblShown.length >= LBL.max) break;
        const s = projectLbl(p);
        if (s.z < 0 || s.z > 1 || s.x < -60 || s.y < -30 || s.x > W+60 || s.y > H+30) continue;
        const hw = Math.min(230, p.lbl.text.length*7.4 + (p.lbl.kind==='tg'?40:22))/2 + 3, hh = LBL.px/2 + 2, cy = s.y - LBL.px/2;
        if (prio(p) === 0 && taken.some(r => Math.abs(r.x-s.x) < r.hw+hw && Math.abs(r.y-cy) < r.hh+hh)) continue;
        taken.push({ x:s.x, y:cy, hw, hh }); lblShown.push(p);
      }
    }
    for (let i = 0; i < lblPool.length; i++) if (i >= lblShown.length) lblPool[i].style.display = 'none';
    lblShown.forEach((p, i) => {
      const el = lblEl(i);
      if (el._key !== p.lbl.key){
        el._key = p.lbl.key; el.className = 'olbl ' + p.lbl.kind;
        el.innerHTML = (p.lbl.kind==='tg' ? TG_ICON : p.lbl.kind==='mine' ? '<i></i>' : '') + '<span></span>';
        el.lastChild.textContent = p.lbl.text;
      }
      el.style.display = '';
    });
  }
  // follow the camera every frame
  for (let i = 0; i < lblShown.length; i++){
    const p = lblShown[i]; if (!p.lbl) continue;
    const s = projectLbl(p), el = lblPool[i];
    if (s.z < 0 || s.z > 1){ el.style.visibility = 'hidden'; continue; }
    el.style.visibility = '';
    el.style.transform = `translate3d(${s.x.toFixed(1)}px,${s.y.toFixed(1)}px,0) translate(-50%,-100%)`;
  }
}

async function buy(p, price){
  if (API.on && !(API.me && API.me.nickname)){ if (!(await ensureLogin())) return; showPlot(p); return; }
  if (S.coins<price) return;
  const hadBuilding = !!p.tpl;
  if (API.on){
    const btn = $('#buyBtn'); if (btn) btn.disabled = true;
    try {
      const r = await api('POST', `/api/plots/${p.id}/buy`, null, 'buy-'+p.id+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
      applyDTO(p, r.plot, false); await refreshMe();
    } catch(e){ toast(e.message); await refreshPlot(p.id); showPlot(p); return; }
  } else {
    S.coins -= price; updateCoins();
    p.state='mine'; p.owner='Siz'; paintPad(p);
  }
  toast(hadBuilding ? 'Tabriklaymiz! Bino endi sizniki.' : 'Tabriklaymiz! Endi bu yer sizniki.');
  if (hadBuilding){ showPlot(p); tut(0); } else { openBuild(p); if (S.tut===1) tut(2); }
}

let ghost = [];
function clearGhost(){ ghost.forEach(m=>m.dispose(false,false)); ghost=[]; }
function makeGhost(b){
  clearGhost();
  const t = getVariant(b);
  for (const pt of t.parts){
    const g = new B.Mesh('ghost', scene);
    pt.mesh.geometry.applyToMesh(g);
    const m = new B.StandardMaterial('gm', scene);
    m.alpha = 0.55; m.specularColor = new C3(.1,.1,.1);
    const src = pt.mesh.material;
    m.diffuseColor = pt.colorKey==='wall' ? hex(b.color) : pt.colorKey==='accent' ? hex(b.accent) : (src.diffuseColor ? src.diffuseColor.clone() : new C3(.75,.72,.68));
    if (src.diffuseTexture) m.diffuseTexture = src.diffuseTexture;
    m.emissiveColor = new C3(.08,.25,.22);
    g.material = m; g.isPickable=false; g.setEnabled(true);
    g.position.set(b.p.x,0.42,b.p.z); g.rotation.y = b.rot*Math.PI/2;
    ghost.push(g);
  }
}

const rising = [];
async function doBuild(){
  const b = S.build, p = b.p, t = TPL[b.tpl], cost = specCost(b);
  if (S.coins < cost) return;
  if (API.on){
    $('#doBuild').disabled = true;
    try {
      const body = t.landmark ? { template:b.tpl, rotation:b.rot } : { template:b.tpl, style:b.style, floors:b.floors, roof:b.roof, rotation:b.rot, color:b.color, accent:b.accent };
      const r = await api('POST', `/api/plots/${p.id}/build`, body, 'build-'+p.id+'-'+Date.now().toString(36));
      closeSheet(); select(p);
      applyDTO(p, r.plot, true); await refreshMe();
      toast(`${buildingName(p)} qurilmoqda…`); if (S.tut===2) tut(3);
    } catch(e){ toast(e.message); const d=$('#doBuild'); if (d) d.disabled=false; }
    return;
  }
  S.coins -= cost; updateCoins();
  Object.assign(p, { tpl:b.tpl, style:b.style, floors:b.floors, roof:b.roof, rot:b.rot, color:b.color, accent:b.accent, building:true });
  closeSheet(); select(p);

  toast(`${buildingName(p)} qurilmoqda…`);
  if (S.tut===2) tut(3);
}

// ---------- find land ----------
function findLand(){
  const tx = camera.target.x, tz = camera.target.z;
  const minBuild = z => Math.min(...templatesFor(z).map(k=>minCost(k)));
  const cand = plots.filter(p=>p.state==='empty' && landPrice(p)+minBuild(p.zone)<=S.coins)
    .map(p=>({p, d:Math.hypot(p.x-tx,p.z-tz)})).sort((a,b)=>a.d-b.d);
  if (!cand.length){ toast(myPlots().length>=S.limit?'Uchastkalar limitiga yetdingiz.':'Mos bo‘sh yer topilmadi.'); return; }
  if (myPlots().length>=S.limit){ toast(`Ko‘pi bilan ${S.limit} ta uchastka olish mumkin.`); return; }
  const p = cand[0].p;
  flyTo(p.x,p.z,85,0.95);
  showPlot(p);
}

// ---------- quality ----------
let shadowGen = null, pipeline = null, glow = null;
const casters = () => {
  const list = [trunk, crown, pole, basin, jet];
  for (const t of Object.values(T)) for (const pt of t.parts) list.push(pt.mesh);
  return list;
};
const isMobile = matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad/i.test(navigator.userAgent);
if (isMobile){ LBL.max = 45; }
function autoStart(){ return isMobile ? 'low' : 'medium'; }
function applyQuality(q){
  S.qActive = q;
  if (shadowGen){ shadowGen.dispose(); shadowGen = null; }
  if (pipeline){ pipeline.dispose(); pipeline = null; }
  if (glow){ glow.dispose(); glow = null; }
  const dpr = window.devicePixelRatio || 1;
  const cap = q==='low' ? 1 : q==='medium' ? 1.5 : 2;
  engine.setHardwareScalingLevel(1 / Math.min(dpr, cap) * (q==='low' && dpr<1.2 ? 1.15 : 1));
  const webgl2 = engine.webGLVersion >= 2;
  if (q==='medium'){
    shadowGen = new B.ShadowGenerator(2048, sun);
    if (webgl2){ shadowGen.usePercentageCloserFiltering = true; shadowGen.filteringQuality = B.ShadowGenerator.QUALITY_LOW; }
    else shadowGen.useBlurExponentialShadowMap = true;
    shadowGen.bias = 0.0008; shadowGen.normalBias = 0.02; shadowGen.darkness = 0.25;
  } else if (q==='high'){
    if (webgl2){
      shadowGen = new B.CascadedShadowGenerator(2048, sun);
      shadowGen.numCascades = 4; shadowGen.lambda = 0.85; shadowGen.shadowMaxZ = 700;
      shadowGen.stabilizeCascades = true; shadowGen.filteringQuality = B.ShadowGenerator.QUALITY_MEDIUM;
      shadowGen.usePercentageCloserFiltering = true; shadowGen.autoCalcDepthBounds = false;
      shadowGen.bias = 0.002; shadowGen.normalBias = 0.02; shadowGen.darkness = 0.2;
    } else {
      shadowGen = new B.ShadowGenerator(4096, sun); shadowGen.useBlurExponentialShadowMap = true; shadowGen.darkness=.2;
    }
  }
  if (shadowGen){ for (const m of casters()) shadowGen.addShadowCaster(m, false); }
  if (q!=='low'){
    pipeline = new B.DefaultRenderingPipeline('pp', true, scene, [camera]);
    pipeline.fxaaEnabled = true;
    pipeline.imageProcessingEnabled = true;
    pipeline.imageProcessing.toneMappingEnabled = true;
    pipeline.imageProcessing.toneMappingType = B.ImageProcessingConfiguration.TONEMAPPING_ACES;
    pipeline.imageProcessing.exposure = 1.15;
    pipeline.imageProcessing.contrast = 1.18;
    if (q==='high'){
      pipeline.samples = 4;
      pipeline.bloomEnabled = true; pipeline.bloomThreshold = 0.75; pipeline.bloomWeight = 0.35; pipeline.bloomKernel = 48; pipeline.bloomScale = 0.5;
      pipeline.imageProcessing.vignetteEnabled = true; pipeline.imageProcessing.vignetteWeight = 1.4;
      glow = new B.GlowLayer('glow', scene, { blurKernelSize: 32, mainTextureRatio: 0.5 });
      glow.intensity = 0.6;
      glow.addIncludedOnlyMesh(bulb); glow.addIncludedOnlyMesh(head); glow.addIncludedOnlyMesh(tail); glow.addIncludedOnlyMesh(dot);
    }
  }
  scene.fogDensity = q==='low' ? 0.0011 : 0.0009;
  carsVisible = q==='low' ? 50 : q==='medium' ? 110 : CAR_N;
}

// ---------- day / night ----------
const SKY_NIGHT = new C3(.05,.08,.17), SKY_DAY = new C3(.55,.74,.93), SKY_DUSK = new C3(.98,.55,.32);
// sky dome palettes: [top, horizon]
const SKY = { day:[hex('#3f7fd4'), hex('#c3dcef')], dusk:[hex('#3b3a78'), hex('#f3a467')], night:[hex('#060a1a'), hex('#1b2342')] };
const WARM = new C3(1,.86,.62);
function clockStr(){ const h=Math.floor(S.hours)%24, m=Math.floor((S.hours%1)*60); return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
const tmpDir = new V3();
function updateSky(){
  const ang = (S.hours-6)/12*Math.PI;
  const sx = Math.cos(ang), sy = Math.sin(ang);
  const elev = sy;
  const day = smooth(-0.12, 0.3, elev);
  const dusk = Math.exp(-Math.pow(elev/0.2,2));
  const night = 1 - smooth(-0.06, 0.18, elev);
  // light direction: sun by day, moon by night
  if (elev > -0.02){ tmpDir.set(-sx, -Math.max(sy,0.06), -0.45); }
  else { tmpDir.set(sx, sy, -0.6); tmpDir.y = -Math.max(-sy,0.25); }
  tmpDir.normalize(); sun.direction.copyFrom(tmpDir);
  sun.position.copyFrom(tmpDir.scale(-600));
  const sunI = elev > -0.02 ? 0.25 + 2.1*smooth(-0.02,0.35,elev) : 0.45*smooth(0, 0.3, -elev);
  sun.intensity = sunI;
  sun.diffuse = elev>-0.02 ? C3.Lerp(new C3(1,.62,.38), new C3(1,.97,.9), smooth(0,0.45,elev)) : new C3(.55,.65,1);
  hemi.intensity = 0.32 + 0.45*day;
  hemi.diffuse = C3.Lerp(new C3(.42,.52,.85), new C3(.95,.97,1), day);
  let sky = C3.Lerp(SKY_NIGHT, SKY_DAY, day);
  sky = C3.Lerp(sky, SKY_DUSK, dusk*0.55*(elev>-0.25?1:0));
  const dk = dusk*(elev>-0.3?1:0);
  let top = C3.Lerp(SKY.night[0], SKY.day[0], day), hor = C3.Lerp(SKY.night[1], SKY.day[1], day);
  top = C3.Lerp(top, SKY.dusk[0], dk*0.8); hor = C3.Lerp(hor, SKY.dusk[1], dk*0.9);
  skyMat.setColor3('topC', top); skyMat.setColor3('horC', hor); skyMat.setColor3('lowC', C3.Lerp(hor, hex('#0b1424'), 0.6));
  skyMat.setVector3('sunDir', new V3(-sx, Math.max(sy, -0.2), -0.45));
  skyMat.setColor3('sunC', C3.Lerp(hex('#ff9a4a'), hex('#fff4d6'), smooth(0, 0.5, elev)).scale(elev > -0.1 ? 1 : 0));
  skyMat.setFloat('glow', 0.4 + dk*1.6); skyMat.setFloat('stars', night);
  scene.clearColor = new C4(hor.r, hor.g, hor.b, 1);
  scene.fogColor = C3.Lerp(hor, sky, 0.35);
  mats.lake.emissiveColor = C3.Lerp(top, hor, 0.6).scale(0.35);
  mats.dot.emissiveColor = hex('#ffcf73').scale(0.15 + night*1.3);
  if (mats.snow) mats.snow.diffuseColor = C3.Lerp(hex('#3a4160'), hex('#f4f1f6'), Math.max(day, dk*0.8)).add(hex('#3a1e10').scale(dk*0.5));
  // windows & lamps
  const ei = night*1.05;
  for (const m of nightMats) m.emissiveTexture.level = ei;
  mats.bulb.emissiveColor = WARM.scale(night*1.4);
  if (glow) glow.intensity = 0.65*night;
  mats.mountain.diffuseColor = C3.Lerp(hex('#1c2034'), hex('#6b6f86'), day).add(hex('#4a2a3a').scale(dk*0.5));
  $('#clock').textContent = clockStr();
  $('#clockIcon').textContent = elev>0.05 ? '☀' : elev>-0.12 ? '◐' : '☾';
}

// ---------- camera controls (map style) ----------
// 1 finger / left mouse: grab-pan anywhere · 2 fingers: pinch zoom, twist rotate, parallel vertical drag tilts
// right mouse / Ctrl+left: orbit + tilt · wheel: zoom to cursor · keys: WASD/arrows, Q/E, R/F, +/-
// Rotation pivot = selected plot (if any), otherwise the point between the fingers / screen centre.
const LIM = { x0: X0-320, x1: X0+W+320, z0: Z0-320, z1: Z0+D+320 };
const ptrs = new Map();
let gest = null, tapStart = null;
const vel = { x:0, z:0 };
const rel = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
function groundAt(x, y){
  camera.getViewMatrix(true);
  const ray = scene.createPickingRay(x, y, B.Matrix.Identity(), camera, false);
  if (ray.direction.y > -0.02) return null;               // looking above the horizon
  const t = Math.min(-ray.origin.y / ray.direction.y, 2500);
  return new V3(ray.origin.x + ray.direction.x*t, 0, ray.origin.z + ray.direction.z*t);
}
function moveTarget(dx, dz){
  camera.target.x = clamp(camera.target.x + dx, LIM.x0, LIM.x1);
  camera.target.z = clamp(camera.target.z + dz, LIM.z0, LIM.z1);
}
function pivotPoint(fallback){
  if (S.selected) return new V3(S.selected.x, 0, S.selected.z);
  return fallback || camera.target.clone();
}
function orbitBy(phi, pv){
  pv = pv || pivotPoint();
  const ox = camera.target.x - pv.x, oz = camera.target.z - pv.z, c = Math.cos(phi), sn = Math.sin(phi);
  camera.target.x = pv.x + ox*c - oz*sn; camera.target.z = pv.z + ox*sn + oz*c;
  camera.alpha += phi;
}
function zoomAt(factor, x, y){
  const g1 = (x!=null) ? groundAt(x,y) : null;
  camera.radius = clamp(camera.radius * factor, camera.lowerRadiusLimit, camera.upperRadiusLimit);
  if (g1){ const g2 = groundAt(x,y); if (g2) moveTarget(g1.x-g2.x, g1.z-g2.z); }
}
function twoInfo(){
  const [a,b] = [...ptrs.values()];
  return { dist: Math.hypot(b.x-a.x, b.y-a.y), ang: Math.atan2(b.y-a.y, b.x-a.x), mx:(a.x+b.x)/2, my:(a.y+b.y)/2 };
}
function stopAuto(){ fly = null; S.autoOrbit = false; S.orbitAnim = 0; const b=$('#orbitBtn'); if (b) b.textContent = 'Atrofida aylanish'; }

canvas.addEventListener('pointerdown', e=>{
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  const p = rel(e); ptrs.set(e.pointerId, p);
  stopAuto(); vel.x = vel.z = 0; S.tour = null; S.cinePause = performance.now() + 4000;
  if (ptrs.size === 1){
    tapStart = { x:p.x, y:p.y, t:performance.now() };
    const orbit = e.pointerType==='mouse' && (e.button===2 || e.button===1 || e.ctrlKey || e.altKey);
    gest = orbit ? { type:'orbit', x:p.x, y:p.y } : { type:'pan', anchor: groundAt(p.x,p.y), t: performance.now() };
  } else if (ptrs.size === 2){
    tapStart = null;
    const i = twoInfo();
    gest = { type:'multi', prev:i, anchor: groundAt(i.mx, i.my) };
  }
});
canvas.addEventListener('pointermove', e=>{
  if (!ptrs.has(e.pointerId)) return;
  const p = rel(e); ptrs.set(e.pointerId, p);
  if (!gest) return;
  if (gest.type==='pan' && ptrs.size===1){
    const g = groundAt(p.x,p.y);
    if (!gest.anchor){ gest.anchor = g; return; }
    if (g){
      const now = performance.now(), dt = Math.max(1, now-gest.t)/1000;
      let dx = gest.anchor.x-g.x, dz = gest.anchor.z-g.z;
      const cap = camera.radius*0.8; const L = Math.hypot(dx,dz); if (L>cap){ dx*=cap/L; dz*=cap/L; }
      moveTarget(dx, dz);
      vel.x = lerp(vel.x, dx/dt, 0.5); vel.z = lerp(vel.z, dz/dt, 0.5); gest.t = now;
      const vmax = camera.radius*2.5, vl = Math.hypot(vel.x, vel.z); if (vl > vmax){ vel.x *= vmax/vl; vel.z *= vmax/vl; }
    }
  } else if (gest.type==='orbit'){
    const dx = p.x-gest.x, dy = p.y-gest.y; gest.x=p.x; gest.y=p.y;
    orbitBy(-dx*0.006);
    camera.beta = clamp(camera.beta - dy*0.005, camera.lowerBetaLimit, camera.upperBetaLimit);
  } else if (gest.type==='multi' && ptrs.size===2){
    const i = twoInfo(), pr = gest.prev;
    let dAng = i.ang - pr.ang; if (dAng>Math.PI) dAng-=2*Math.PI; if (dAng<-Math.PI) dAng+=2*Math.PI;
    const dDist = i.dist - pr.dist, dmx = i.mx - pr.mx, dmy = i.my - pr.my;
    const tilting = Math.abs(dDist) < 3 && Math.abs(dAng) < 0.015 && Math.abs(dmy) > 1.5*Math.abs(dmx) && Math.abs(dmy) > 0.5;
    if (tilting){
      camera.beta = clamp(camera.beta - dmy*0.006, camera.lowerBetaLimit, camera.upperBetaLimit);
    } else {
      // pan: keep the ground point between the fingers under the fingers
      const g = groundAt(i.mx, i.my);
      if (gest.anchor && g) moveTarget(gest.anchor.x-g.x, gest.anchor.z-g.z);
      // zoom
      if (pr.dist > 10 && i.dist > 10) zoomAt(pr.dist / i.dist, i.mx, i.my);
      // twist: around the selected plot, otherwise around the fingers
      if (Math.abs(dAng) > 0.002) orbitBy(dAng, pivotPoint(groundAt(i.mx, i.my)));
    }
    gest.prev = i; gest.anchor = groundAt(i.mx, i.my);
  }
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  const p = rel(e);
  ptrs.delete(e.pointerId);
  if (tapStart && ptrs.size===0){
    const moved = Math.hypot(p.x-tapStart.x, p.y-tapStart.y), dur = performance.now()-tapStart.t;
    if (moved < 8 && dur < 450 && e.button===0) { vel.x = vel.z = 0; handleTap(p.x, p.y); }
  }
  if (ptrs.size === 1){ const q = [...ptrs.values()][0]; gest = { type:'pan', anchor: groundAt(q.x,q.y), t: performance.now() }; tapStart = null; }
  else if (ptrs.size === 0){ if (gest && gest.type!=='pan') { vel.x = vel.z = 0; } else if (performance.now() - (gest?gest.t:0) > 80) { vel.x = vel.z = 0; } gest = null; }
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e=>{ e.preventDefault(); stopAuto(); const p=rel(e); zoomAt(Math.exp(e.deltaY*0.0012), p.x, p.y); }, { passive:false });
const keys = new Set();
window.addEventListener('keydown', e=>{ if (e.target.tagName==='INPUT') return; keys.add(e.key.toLowerCase()); });
window.addEventListener('keyup', e=>keys.delete(e.key.toLowerCase()));
function keyboard(dt){
  if (!keys.size) return;
  const sp = camera.radius*1.2*dt, a = camera.alpha;
  const fx = -Math.cos(a), fz = -Math.sin(a), rx = Math.sin(a), rz = -Math.cos(a);
  let f=0, r=0;
  if (keys.has('w')||keys.has('arrowup')) f+=1; if (keys.has('s')||keys.has('arrowdown')) f-=1;
  if (keys.has('d')||keys.has('arrowright')) r+=1; if (keys.has('a')||keys.has('arrowleft')) r-=1;
  if (f||r){ stopAuto(); moveTarget((fx*f + rx*r)*sp, (fz*f + rz*r)*sp); }
  if (keys.has('q')) orbitBy(1.2*dt); if (keys.has('e')) orbitBy(-1.2*dt);
  if (keys.has('r')) camera.beta = clamp(camera.beta-0.8*dt, camera.lowerBetaLimit, camera.upperBetaLimit);
  if (keys.has('f')) camera.beta = clamp(camera.beta+0.8*dt, camera.lowerBetaLimit, camera.upperBetaLimit);
  if (keys.has('+')||keys.has('=')) zoomAt(1-1.2*dt); if (keys.has('-')) zoomAt(1+1.2*dt);
}

function handleTap(x, y){
  const hit = scene.pick(x, y, m => m===pad || (m.hasThinInstances && m.isEnabled() && m.name!=='ghost' && Object.values(T).some(t=>t.parts.some(pt=>pt.mesh===m))));
  if (!hit || !hit.hit){ if (S.sheet!=='build'){ closeSheet(); select(null); } return; }
  let p = null;
  if (hit.pickedMesh === pad) p = plots[hit.thinInstanceIndex];
  else for (const t of Object.values(T)){ if (t.parts.some(pt=>pt.mesh===hit.pickedMesh)){ const pid=t.plotsByInst[hit.thinInstanceIndex]; if(pid!=null) p=plots[pid]; break; } }
  if (!p) return;
  if (S.sheet==='build' && S.build && S.build.p===p) return;
  clearGhost();
  showPlot(p);
}

// ---------- render loop ----------
let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsT = 0, autoT = 0, autoChecks = 0;
const fpsHist = [];
scene.onBeforeRenderObservable.add(()=>{
  const now = performance.now(), dt = Math.min(0.1,(now-last)/1000); last = now;
  // time
  const dh = SPEEDS[S.speed]*dt; S.hours = (S.hours + dh) % 24;
  updateSky();
  // income
  if (API.on){ S.pending += (S.daily||0) * dt / (API.daySeconds||86400); }
  else { const mine = myPlots(); let daily = 0; for (const p of mine) if (p.tpl && !p.building) daily += specIncome(p); S.pending += daily * dh/24; }
  if (S.sheet==='mine'){ const el=$('#pend'); if (el) el.textContent = fmt(S.pending); const c=$('#collect'); if(c) c.disabled = S.pending<1; }
  // rising buildings
  for (let i=rising.length-1;i>=0;i--){
    const r = rising[i]; r.t += dt; const k = clamp(r.t/r.dur,0,1); const e = 1-Math.pow(1-k,3);
    if (!r.p.tpl || r.p.inst==null){ rising.splice(i,1); continue; }
    const m = plotMatrix(r.p, Math.max(0.02,e));
    for (const pt of T[r.p.vkey].parts) pt.mesh.thinInstanceSetMatrixAt(r.p.inst, m, true);
    if (k>=1){ rising.splice(i,1); r.p.building=false; if (r.p.state==='mine'){ toast(`${buildingName(r.p)} tayyor! Kuniga +${fmt(specIncome(r.p))} tanga.`); if (API.on) refreshMe(); if (S.tut===3) setTimeout(()=>tut(0),4000); } }
  }
  // camera fly
  if (fly){
    fly.t = Math.min(1, fly.t + dt/0.9); const e = 1-Math.pow(1-fly.t,3);
    camera.target.x = lerp(fly.from.x, fly.to.x, e); camera.target.z = lerp(fly.from.z, fly.to.z, e);
    camera.radius = lerp(fly.from.r, fly.to.r, e); camera.beta = lerp(fly.from.b, fly.to.b, e);
    if (fly.to.a!=null) camera.alpha = lerp(fly.from.a, fly.to.a, e);
    if (fly.t>=1) fly = null;
  }
  // welcome-screen cinematic orbit (pauses for a few seconds whenever someone drags the city)
  if (S.cine && !gest && now > (S.cinePause||0)){
    camera.alpha += dt*0.045;
    camera.target.x += (0 - camera.target.x)*Math.min(1, dt*0.8); camera.target.z += (0 - camera.target.z)*Math.min(1, dt*0.8);
    camera.radius += ((isMobile ? 430 : 360) - camera.radius)*Math.min(1, dt*0.6); camera.beta += (1.17 - camera.beta)*Math.min(1, dt*0.6);
  }
  if (S.tour){
    S.tour.t += dt;
    if (S.tour.t > 4.6){
      S.tour.t = 0; S.tour.i++;
      if (S.tour.i >= S.tour.list.length){ S.tour = null; toast(tr('tourEnd')); }
      else { const p = S.tour.list[S.tour.i], h = T[p.vkey] ? T[p.vkey].height : 60; select(p); flyTo(p.x, p.z, h*2.3, 1.14); toast(`${TPL[p.tpl].name} · ${TPL[p.tpl].city} · ${TPL[p.tpl].realHeight} m`); }
    }
  }
  // pan inertia, rotate-button animation, auto orbit, keyboard
  if (!gest && (Math.abs(vel.x)+Math.abs(vel.z)) > 0.5){ moveTarget(vel.x*dt, vel.z*dt); const k = Math.exp(-dt*5); vel.x*=k; vel.z*=k; }
  if (S.orbitAnim){ const st = S.orbitAnim*Math.min(1, dt*7); orbitBy(st); S.orbitAnim -= st; if (Math.abs(S.orbitAnim)<1e-3) S.orbitAnim = 0; }
  if (S.autoOrbit) orbitBy(dt*0.35);
  keyboard(dt);
  camera.target.y = 0;
  updateLabels(dt);
  // selector pulse
  if (selector.isEnabled()){ const s = 1 + Math.sin(now/220)*0.03; selector.scaling.set(s,1,s); mats.sel.emissiveColor = hex('#2fb5a3').scale(0.6+0.4*Math.sin(now/220)); }
  // water shimmer + traffic
  jet.scaling.y = 1 + Math.sin(now/160)*0.06;
  lakeTex.uOffset += dt*0.004; lakeTex.vOffset += dt*0.002;
  updateCars(dt);
  // fps + auto quality
  fpsAcc += engine.getFps(); fpsN++; fpsT += dt;
  if (fpsT > 0.5){
    const f = fpsAcc/fpsN; fpsHist.push(f); if (fpsHist.length>8) fpsHist.shift();
    $('#fps').innerHTML = `<b>${f.toFixed(0)}</b> fps · ${QNAMES[S.qActive]}`;
    fpsAcc=0; fpsN=0; fpsT=0;
  }
  if (S.quality==='auto'){
    autoT += dt;
    if (autoT > 4 && fpsHist.length>=6){
      const avg = fpsHist.reduce((a,b)=>a+b,0)/fpsHist.length;
      const order = ['low','medium','high'], i = order.indexOf(S.qActive);
      if (avg < 27 && i>0){ applyQuality(order[i-1]); toast(`Grafika: ${QNAMES[order[i-1]]} (tezlik uchun)`); fpsHist.length=0; }
      else if (avg > 56 && i<2 && autoChecks<2 && (!isMobile || order[i+1]==='medium')){ applyQuality(order[i+1]); fpsHist.length=0; autoChecks++; }
      autoT = 0;
    }
  }
});

// ---------- server connection (when served by the Mahalla server; the artifact runs as an offline demo) ----------
function applyDTO(p, d, animate){
  const me = API.me;
  const mine = !!(me && d.owner && d.owner.id === me.id);
  p.ownerId = d.owner ? d.owner.id : null;
  p.owner = d.owner ? (d.owner.nickname || '—') : null;
  p.listed = d.state === 'sale';
  p.state = mine ? 'mine' : d.state;
  p.price = d.price; p.likes = d.likes;
  p.ownerTg = d.owner ? (d.owner.telegram || null) : null;
  const b = d.building;
  const newKey = b ? vkey({ tpl:b.template, style:b.style, floors:b.floors, roof:b.roof }) : null;
  if (b && TPL[b.template] && (!p.tpl || p.vkey !== newKey || p.inst == null)){
    if (p.tpl) hideBuilding(p);
    Object.assign(p, { tpl:b.template, style:b.style, floors:b.floors, roof:b.roof, rot:b.rotation, color:b.color, accent:b.accent });
    const left = (Date.parse(b.readyAt) - Date.now())/1000;
    p.building = left > 0;
    addBuilding(p, animate);
    if (animate) rising.push({ p, t:0, dur: Math.max(2.5, left) });
    else if (left > 0) setTimeout(()=>{ p.building = false; }, left*1000);
  } else if (!b && p.tpl){ hideBuilding(p); p.tpl = null; }
  paintPad(p, animate);
}
async function api(method, url, body, idemKey){
  const headers = {};
  if (body) headers['content-type'] = 'application/json';
  if (idemKey) headers['idempotency-key'] = idemKey;
  const r = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
  let j = null; try { j = await r.json(); } catch(_){}
  if (!r.ok){ const e = new Error((j && j.message) || 'Xatolik yuz berdi'); e.code = j && j.error; e.status = r.status; e.data = j; throw e; }
  return j;
}
async function refreshMe(){
  const me = await api('GET','/api/me');
  API.me = me; S.coins = me.balance; S.pending = me.pending; S.daily = me.dailyIncome; S.limit = me.plotLimit;
  updateCoins(); $('.brand span').textContent = me.nickname || 'Mahalla';
  return me;
}
async function refreshPlot(id){ try { applyDTO(plots[id], await api('GET',`/api/plots/${id}`), false); } catch(_){} }
function connectWs(){
  try {
    const ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host + '/ws');
    ws.onmessage = ev => { try { const m = JSON.parse(ev.data); if (m.type==='plot' && plots[m.plot.id]){ const p = plots[m.plot.id]; applyDTO(p, m.plot, true); if (S.selected===p && S.sheet==='plot') showPlot(p); } } catch(_){} };
    ws.onclose = () => setTimeout(connectWs, 3000);
  } catch(_){}
}

function renderChips(){
  const lm = ['lm_burj','lm_abraj','lm_shanghai','lm_owtc','lm_merdeka'].map(k => plots.find(p => p.tpl === k)).filter(Boolean);
  const tea = plots.find(p => p.tpl === 'cafe' && p.style === 'milliy');
  const items = lm.map(p => [p, TPL[p.tpl].name.replace(/ \(.*\)$/, '')]);
  if (tea) items.push([tea, tr('choyxona')]);
  $('#hChips').innerHTML = items.map(([p, n]) => `<button data-pid="${p.id}">${esc(n)}</button>`).join('');
  $('#hChips').querySelectorAll('button').forEach(b => b.onclick = () => { const p = plots[+b.dataset.pid]; leaveHero(); visitPlot(p); });
}
function countUp(el, to){
  const from = +(el.dataset.v || 0), t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0)/1400), v = Math.round(from + (to - from)*(1 - Math.pow(1-k, 3))); el.textContent = fmt(v); if (k < 1) requestAnimationFrame(step); else el.dataset.v = to; };
  requestAnimationFrame(step);
}
function setPopulation(n){ countUp($('#popN'), n); countUp($('#popN2'), n); }

  if (myPlots().length) visitPlot(myPlots()[0]); else { findLand(); if (S.tut) tut(1); }
};
$('#browseBtn').onclick = () => { leaveHero(); if (!API.on || (API.me && API.me.nickname)) tut(1); else toast('Ko‘rish rejimi. Yer olish uchun bo‘sh uchastkani bosing.'); };

// sign-in only when it is needed (buying), so visitors can look around freely
async function ensureLogin(){
  if (!API.on) return true;
  if (API.me && API.me.nickname) return true;
  if (!API.me){ const ok = await showLogin(API.opts); if (!ok){ closeAuth(); return false; } await refreshMe(); }
  if (!API.me.nickname){ await showNickname(); await refreshMe(); }
  closeAuth();
  try { const c = await api('GET','/api/city'); for (const d of c.plots) applyDTO(plots[d.id], d, false); flushBuffers(); } catch(_){}
  return true;
}

async function boot(){
  let opts = null;
  if (location.protocol.startsWith('http')){
    try {
      const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 3000);
      const r = await fetch('/api/auth/options', { signal: ctl.signal, credentials:'same-origin' }); clearTimeout(to);
      if (r.ok && (r.headers.get('content-type')||'').includes('json')){
        const j = await r.json();
        // only our own server answers with exactly this shape; anything else = no Mahalla server here
        if (j && typeof j.dev === 'boolean' && 'telegramBot' in j) opts = j;
      }
    } catch(_){}
  }
  const offline = () => { // demo mode without a server (e.g. the published artifact)
    API.on = false;
    populateDemo(); flushBuffers(); updateCoins();
    $('#loader').classList.add('hide');
    showHero(); setPopulation(new Set(plots.filter(p => p.owner && p.owner !== 'Shahar hokimligi').map(p => p.owner)).size);
  };
  if (!opts) return offline();
  API.on = true;
  let city;
  try { city = await api('GET','/api/city'); if (!city || !Array.isArray(city.plots)) throw new Error('bad city'); }
  catch(e){ return offline(); }
  try {
    API.daySeconds = city.economy.daySeconds; S.limit = city.economy.plotLimit;
    seed = 7;
    for (const d of city.plots){ const p = plots[d.id]; if (!p) continue; applyDTO(p, d, false);
      if (p.zone==='res' && p.tpl && rnd()<0.5) addTree(p.x+3.6*(rnd()<.5?-1:1), p.z+3.6*(rnd()<.5?-1:1), 0.55); }
    flushBuffers();
  } catch(e){ console.error(e); }
  API.opts = opts;
  $('#loader').classList.add('hide');
  connectWs();
  let me = null;
  try { me = await refreshMe(); } catch(_){}
  if (!me || !me.nickname){ showHero(); setPopulation(city.stats ? city.stats.residents : 0); return; }
  closeAuth();
  // re-mark my plots now that we know who "me" is
  const city2 = await api('GET','/api/city');
  for (const d of city2.plots) applyDTO(plots[d.id], d, false);
  pad.thinInstanceBufferUpdated('color');
  if (!me.plots.length) setTimeout(()=>tut(1), 400); else tut(0);
}

// ---------- start ----------
applyQuality(autoStart());
updateCoins(); updateSky();
scene.executeWhenReady(()=>{ boot().catch(e=>{ console.error(e); $('#loader').classList.add('hide'); }); });
setTimeout(()=>{ const l=$('#loader'); if (l && !l.classList.contains('hide')){ $('#loadMsg').textContent='Yuklanish uzoq davom etmoqda… Internet yoki brauzerni tekshiring (Chrome / Safari yangi versiyasi).'; } }, 15000);
engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize', ()=>engine.resize());
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) engine.stopRenderLoop(); else { last = performance.now(); engine.runRenderLoop(()=>scene.render()); } });
window.__mahalla = { scene, engine, plots, S, applyQuality, camera, T, vel, setLabel, addBuilding, paintPad, LM_KEYS, getVariant, flushBuffers };
})();
</script>
